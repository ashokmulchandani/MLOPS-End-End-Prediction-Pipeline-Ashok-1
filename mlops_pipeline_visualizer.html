<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLOps Pipeline Visualizer — By Project Phase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fc;--card:#fff;--raised:#eef0f5;--border:#dde0e6;--text:#1a1d23;--tdim:#4a4f5b;--tmut:#8b909b;--violet:#5b3aa8;--vbg:#f3effc;--cyan:#007a99;--cyan-bg:#e6f4f7;--amber:#b87000;--amber-bg:#fff6e5;--green:#1a6e34;--green-bg:#e6f4ea;--red:#c62828;--red-bg:#ffebe9;--magenta:#9e2a6b;--magenta-bg:#fdf0f7;--blue:#2979ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh}
.app{max-width:1000px;margin:0 auto;padding:1.5rem}
.header{text-align:center;padding:1rem 0 0.3rem}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;color:var(--violet)}
.header .subtitle{color:var(--tdim);font-size:0.82rem;margin-top:0.2rem}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:0.35rem;justify-content:center;margin:0.8rem 0}
.tab{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;font-weight:600;padding:0.45em 0.9em;border-radius:100px;border:1.5px solid var(--border);background:var(--card);color:var(--tdim);cursor:pointer;transition:0.15s;display:flex;align-items:center;gap:0.3em}
.tab:hover{border-color:var(--violet);color:var(--violet)}
.tab.active{background:var(--violet);border-color:var(--violet);color:#fff}
.tab .tb-emoji{font-size:0.85rem}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0.4rem;margin:0.6rem 0}
.metric{text-align:center;padding:0.4rem}
.metric .val{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700}
.metric .lbl{font-size:0.55rem;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em;margin-top:0.1rem}

/* Banner */
.perf-banner{display:flex;align-items:center;justify-content:center;gap:0.6rem;padding:0.55rem 1.2rem;background:var(--card);border:1px solid var(--border);border-radius:10px;margin:0.5rem 0;flex-wrap:wrap}
.perf-item{text-align:center}.perf-item .pv{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700}.perf-item .pl{font-size:0.52rem;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em}
.perf-divider{width:1px;height:26px;background:var(--border)}

/* Pipeline */
.pipeline-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin:0.6rem 0}
.pipeline-label{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--tmut);text-align:center;margin-bottom:0.8rem}
.pipeline{display:flex;align-items:flex-start;justify-content:center;gap:0;flex-wrap:wrap}
.pipe-stage{text-align:center;padding:0.7rem 0.9rem;border-radius:12px;cursor:pointer;transition:0.2s;min-width:110px;max-width:145px;border:2px solid var(--border);background:var(--card)}
.pipe-stage:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(91,58,168,0.08)}
.pipe-stage.active-stage{box-shadow:0 0 0 4px rgba(91,58,168,0.05)}
.pipe-stage.zone-pre{border-color:var(--amber);background:var(--amber-bg)}.pipe-stage.zone-pre:hover,.pipe-stage.zone-pre.active-stage{border-color:var(--amber);background:var(--amber-bg)}
.pipe-stage.zone-train{border-color:var(--violet);background:var(--vbg)}.pipe-stage.zone-train:hover,.pipe-stage.zone-train.active-stage{border-color:var(--violet);background:var(--vbg)}
.pipe-stage.zone-post{border-color:var(--green);background:var(--green-bg)}.pipe-stage.zone-post:hover,.pipe-stage.zone-post.active-stage{border-color:var(--green);background:var(--green-bg)}

.zone-divider{display:flex;align-items:center;gap:0.4rem;margin:0.6rem 0;font-family:'Space Grotesk',sans-serif;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--tmut)}
.zone-divider::before,.zone-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.zone-divider.z-amber{color:var(--amber)}.zone-divider.z-amber::before,.zone-divider.z-amber::after{background:var(--amber)}
.zone-divider.z-violet{color:var(--violet)}.zone-divider.z-violet::before,.zone-divider.z-violet::after{background:var(--violet)}
.zone-divider.z-green{color:var(--green)}.zone-divider.z-green::before,.zone-divider.z-green::after{background:var(--green)}

.pipeline-group{display:flex;align-items:flex-start;justify-content:center;gap:0;flex-wrap:wrap;padding:0.5rem 0.8rem;border-radius:12px;margin:0.3rem 0}
.pipeline-group.zone-pre-bg{border:1px dashed rgba(184,112,0,0.2);background:rgba(184,112,0,0.03)}
.pipeline-group.zone-train-bg{border:1px dashed rgba(91,58,168,0.15);background:rgba(91,58,168,0.03)}
.pipeline-group.zone-post-bg{border:1px dashed rgba(26,110,52,0.15);background:rgba(26,110,52,0.03)}
.pipe-stage .st-emoji{font-size:1.5rem;display:block;margin-bottom:0.2rem}
.pipe-stage .st-name{font-family:'Space Grotesk',sans-serif;font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
.pipe-stage .st-time{font-size:0.5rem;color:var(--tmut);margin-top:0.1rem}
.pipe-stage .st-desc{font-size:0.5rem;color:var(--tdim);margin-top:0.1rem;line-height:1.3}
.pipe-arrow{display:flex;align-items:center;padding:0 0.3rem;color:var(--violet);font-size:1.3rem;font-weight:300;margin-top:0.85rem;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}

/* Substeps */
.substeps{background:var(--vbg);border:1px solid rgba(91,58,168,0.15);border-radius:10px;padding:1rem;margin:0.8rem 0 0;display:none}
.substeps.show{display:block;animation:slideDown 0.3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.substeps h4{font-family:'Space Grotesk',sans-serif;font-size:0.7rem;color:var(--violet);margin-bottom:0.6rem}
.substep-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.4rem}
.substep{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.65rem}
.substep .ss-num{font-family:'Space Grotesk',sans-serif;font-size:0.5rem;color:var(--violet);font-weight:700}
.substep .ss-title{font-weight:600;font-size:0.7rem;margin:0.15rem 0}
.substep .ss-code{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--tdim);background:rgba(0,0,0,0.03);padding:0.3rem 0.5rem;border-radius:4px;margin-top:0.3rem;white-space:pre-wrap;line-height:1.5}
.substep .ss-tag{display:inline-block;font-size:0.48rem;padding:1px 6px;border-radius:100px;margin-top:0.25rem}
.ss-tag.design{background:var(--vbg);color:var(--violet)}.ss-tag.data{background:var(--cyan-bg);color:var(--cyan)}
.ss-tag.features{background:var(--magenta-bg);color:var(--magenta)}.ss-tag.baseline{background:rgba(41,121,255,0.08);color:var(--blue)}
.ss-tag.pipeline{background:var(--green-bg);color:var(--green)}.ss-tag.mlops{background:var(--amber-bg);color:var(--amber)}
.ss-tag.test{background:var(--red-bg);color:var(--red)}

.substep .ss-viz{display:flex;align-items:center;gap:0.25rem;margin:0.35rem 0;font-size:0.62rem;flex-wrap:wrap}
.ss-viz .vz-box{background:var(--card);border:1.5px solid var(--border);border-radius:5px;padding:0.2rem 0.45rem;font-weight:600;font-family:'Space Grotesk',sans-serif;font-size:0.52rem;display:flex;align-items:center;gap:0.15rem}
.ss-viz .vz-arrow{color:var(--violet);font-weight:700}
.ss-viz .vz-input{border-color:var(--amber);background:var(--amber-bg)}
.ss-viz .vz-process{border-color:var(--violet);background:var(--vbg)}
.ss-viz .vz-output{border-color:var(--green);background:var(--green-bg)}

@media(max-width:768px){.pipeline{flex-direction:column;align-items:center}.pipe-arrow{transform:rotate(90deg);margin:0}.substep-grid{grid-template-columns:1fr}.perf-banner{gap:0.4rem}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <h1>MLOps Pipeline — By Project Phase</h1>
  <p class="subtitle">Every phase follows the same pattern: PREPROCESS → TRAIN → POST-PROCESS. Click a stage to explore.</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab(0)"><span class="tb-emoji">🧠</span> P1-4: Think</button>
  <button class="tab" onclick="switchTab(1)"><span class="tb-emoji">🏠</span> P5: House Prices</button>
  <button class="tab" onclick="switchTab(2)"><span class="tb-emoji">🏗️</span> P6: Enterprise</button>
  <button class="tab" onclick="switchTab(3)"><span class="tb-emoji">🧪</span> P6G: Testing</button>
  <button class="tab" onclick="switchTab(4)"><span class="tb-emoji">📈</span> P7: Monitor</button>
  <button class="tab" onclick="switchTab(5)"><span class="tb-emoji">🏆</span> P8: Capstone</button>
</div>

<div id="app"></div>
</div>

<script>
const tabs = [
{ // 0: Phases 1-4 THINK
  name:'🧠 Phases 1-4: Think Before You Build', phases:'System Design → Data Strategy → Features → Baseline',
  metrics:[{val:'4 Phases',lbl:'System Design First',color:'var(--violet)'},{val:'38 Steps',lbl:'Total Substeps',color:'var(--amber)'},{val:'House Prices',lbl:'Running Example',color:'var(--cyan)'},{val:'Design→Baseline',lbl:'Before Coding',color:'var(--green)'}],
  banner:[{val:'Phase 1',lbl:'System Design',color:'var(--violet)'},{val:'Phase 2',lbl:'Data Strategy',color:'var(--cyan)'},{val:'Phase 3',lbl:'Features',color:'var(--magenta)'},{val:'Phase 4',lbl:'Baseline',color:'var(--blue)'}],
  stages:[
    {emoji:'📐',name:'PREPROCESS',time:'Phases 1-2',desc:'Frame problem + source data',
     substeps:[
       {n:'1.1',title:'6-Word Test: Does ML Apply?',tag:'design',
        viz:'<span class="vz-box vz-input">📋 Problem</span><span class="vz-arrow">→</span><span class="vz-box vz-process">6-Word Test</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ ML Justified</span>',
        code:'Learn, Complex, Patterns, Existing data, Predictions, Unseen\n→ House Prices PASSES all 6. ML is justified.'},

        viz:'<span class="vz-box vz-input">❓ Vague</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Template</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ Precise</span>',
        code:'Given 82 features → Predict SalePrice (USD)\nFor agents → At <500ms → To reduce negotiation 30%'},
       {n:'1.3',title:'Metrics Ladder + Guardrails',tag:'design',
        viz:'<span class="vz-box vz-input">📊 Business</span><span class="vz-arrow">→</span><span class="vz-box vz-process">📱 Product</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🤖 Model: R²>0.85</span>',
        code:'⭐ North Star: R² > 0.85\n🛡 Guardrails: RMSE<$25K, Overfit Δ<0.05, MAE<$18K'},
       {n:'1.4',title:'Data Source + Sampling Strategy',tag:'data',
        viz:'<span class="vz-box vz-input">🏛️ Public Records</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Random Split</span><span class="vz-arrow">→</span><span class="vz-box vz-output">2,930 rows</span>',
        code:'Ames Housing: 2,930 rows × 82 cols\nSource: Ames City Assessor (public records)\nSplit: 80/20 random (houses are independent)'},
     ]},
    {emoji:'🎯',name:'TRAIN',time:'Phases 3-4',desc:'Engineer features + run baseline',
     substeps:[
       {n:'2.1',title:'Feature Profiling + Missing Values',tag:'features',
        viz:'<span class="vz-box vz-input">82 cols</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Profile</span><span class="vz-arrow">→</span><span class="vz-box vz-output">Drop 4, Scale 38, Encode 43</span>',
        code:'DROP: PoolQC(99.7%), Alley(93%), Fence(80%)\nFILL 0: GarageYrBlt(5%) — "no garage"\nLog-transform: SalePrice (skew=1.88)'},
       {n:'2.2',title:'Scaling, Encoding, Train/Serve Parity',tag:'features',
        viz:'<span class="vz-box vz-input">Raw</span><span class="vz-arrow">→</span><span class="vz-box vz-process">sklearn.Pipeline</span><span class="vz-arrow">→</span><span class="vz-box vz-output">Model-Ready</span>',
        code:'StandardScaler(38 num) + OneHotEncode(37 cat)\n+ OrdinalEncode(6 quality)\n= sklearn.Pipeline — SAME code for train AND serve'},
       {n:'2.3',title:'Baseline v0: $/sqft Rule',tag:'baseline',
        viz:'<span class="vz-box vz-input">🏠 sqft</span><span class="vz-arrow">→</span><span class="vz-box vz-process">× $150</span><span class="vz-arrow">→</span><span class="vz-box vz-output">$Price</span>',
        code:'v0: Price = $150 × GrLivArea\nR² = 0.50 | Build time: 5 min | Cost: $0\nIf ML cannot beat this, don\'t use ML.'},
       {n:'2.4',title:'Baseline v1: Linear Regression (3 features)',tag:'baseline',
        viz:'<span class="vz-box vz-input">3 features</span><span class="vz-arrow">→</span><span class="vz-box vz-process">LinearRegression</span><span class="vz-arrow">→</span><span class="vz-box vz-output">R²=0.78</span>',
        code:'v1: LinearRegression(GrLivArea, OverallQual, GarageCars)\nR² = 0.78 | +56% lift over v0\nML IS justified → Proceed to Phase 5'},
     ]},
    {emoji:'📋',name:'POST-PROCESS',time:'Phase 4',desc:'Compare, document, ship gradually',
     substeps:[
       {n:'3.1',title:'v0 vs v1 — Lift Analysis',tag:'baseline',
        viz:'<span class="vz-box vz-input">v0: R²=0.50</span><span class="vz-arrow">VS</span><span class="vz-box vz-process">v1: R²=0.78</span><span class="vz-arrow">→</span><span class="vz-box vz-output">+56% Lift ✅</span>',
        code:'Lift: R² +0.28, RMSE -$18K, MAE -$15K\nML IS worth the investment. Proceed to full pipeline.'},
       {n:'3.2',title:'Gradual Rollout Plan',tag:'baseline',
        viz:'<span class="vz-box vz-input">Shadow</span><span class="vz-arrow">→</span><span class="vz-box vz-process">5%</span><span class="vz-arrow">→</span><span class="vz-box vz-output">100%</span>',
        code:'Week 1-2: Shadow (0% user impact)\nWeek 3: 5% → Week 4: 25% → Week 5: 100%\nRollback trigger: R² < 0.75 on live data'},
       {n:'3.3',title:'Log Everything From Day 1',tag:'data',
        viz:'<span class="vz-box vz-input">🔮 Predict</span><span class="vz-arrow">→</span><span class="vz-box vz-process">📝 Log</span><span class="vz-arrow">→</span><span class="vz-box vz-output">🏷️ Actual Label</span>',
        code:'Log: prediction_id, timestamp, model_version,\nall 82 input features, predicted_price\nLater: actual_sale_price, error, error_pct'},
     ]},
  ]
},
{ // 1: Phase 5 House Prices
  name:'🏠 Phase 5: House Prices Predictor', phases:'ZenML + MLflow + Design Patterns',
  metrics:[{val:'ZenML',lbl:'Pipeline Orchestrator',color:'var(--violet)'},{val:'MLflow',lbl:'Experiment Tracking',color:'var(--cyan)'},{val:'82→250',lbl:'Features After Encoding',color:'var(--amber)'},{val:'R²>0.85',lbl:'Target Accuracy',color:'var(--green)'}],
  banner:[{val:'Factory',lbl:'Data Ingestion',color:'var(--violet)'},{val:'Strategy',lbl:'Processing (×7)',color:'var(--cyan)'},{val:'Template',lbl:'EDA Analysis',color:'var(--amber)'},{val:'Pipeline',lbl:'ZenML Decorator',color:'var(--green)'}],
  stages:[
    {emoji:'📥',name:'PREPROCESS',time:'~30 min',desc:'Ingest → EDA → Clean → Feature',
     substeps:[
       {n:'1.1',title:'Data Ingestion (Factory Pattern)',tag:'pipeline',
        viz:'<span class="vz-box vz-input">📦 archive.zip</span><span class="vz-arrow">→</span><span class="vz-box vz-process">DataIngestorFactory</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📊 DataFrame</span>',
        code:'DataIngestor(ABC) → ZipDataIngestor, CSVIngestor\nFactory.get_ingestor(".zip") → ZipDataIngestor\nAuto-detect + route. Error handling built in.'},

        viz:'<span class="vz-box vz-input">📊 82 cols</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Strategy+Template</span><span class="vz-arrow">→</span><span class="vz-box vz-output">📋 Decision Doc</span>',
        code:'Strategy Pattern: DataInspection, Univariate, Bivariate\nTemplate Pattern: MissingValues, Multivariate\n→ SalePrice skewed(1.88), OverallQual top predictor'},
       {n:'1.3',title:'Missing Values + Feature Engineering',tag:'pipeline',
        viz:'<span class="vz-box vz-input">🕳️ Nulls</span><span class="vz-arrow">→</span><span class="vz-box vz-process">Strategy Pattern</span><span class="vz-arrow">→</span><span class="vz-box vz-output">✅ Clean</span>',
        code:'MissingValueHandler: DropMissing OR FillMissing\nFeatureEngineering: LogTransform, StandardScale,\nMinMaxScale, OneHotEncode'},
       {n:'1.4',title:'Outlier Detection + Data Split',tag:'pipeline',

{ // 2: Phase 6 Enterprise
  name:'🏗️ Phase 6: Enterprise Training Data Pipeline', phases:'Async Load → AI Generate → Quality → Export',

let activeTab = 0, activeStage = 0;

function switchTab(i) { activeTab = i; activeStage = 0; document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('active', j===i)); render(); }
function setStage(i) { activeStage = i; render(); }

function render() {
  const t = tabs[activeTab], stage = t.stages[activeStage];
  let h = '';

  // Metrics
  h += '<div class="metrics">';
  t.metrics.forEach(m => h += `<div class="metric"><div class="val" style="color:${m.color}">${m.val}</div><div class="lbl">${m.lbl}</div></div>`);
  h += '</div>';

  // Banner
  h += '<div class="perf-banner">';
  t.banner.forEach((b,i) => {
    if (i>0) h += '<div class="perf-divider"></div>';
    h += `<div class="perf-item"><div class="pv" style="color:${b.color}">${b.val}</div><div class="pl">${b.lbl}</div></div>`;
  });
  h += '</div>';

  // Pipeline — LEFT TO RIGHT: PREPROCESS → TRAIN → POST-PROCESS
  const stageZoneClasses = ['zone-pre', 'zone-train', 'zone-post'];
  const zoneLabels = ['📥 PREPROCESS', '🧠 TRAIN', '📤 POST-PROCESS'];
  h += '<div class="pipeline-card"><div class="pipeline-label">' + t.name + ' — ' + t.phases + '</div>';
  // Zone labels row
  h += '<div style="display:flex;justify-content:center;gap:0;margin-bottom:0.4rem">';
  h += '<span style="flex:1;max-width:145px;text-align:center;font-family:\'Space Grotesk\',sans-serif;font-size:0.55rem;font-weight:700;color:var(--amber);letter-spacing:0.06em;text-transform:uppercase">📥 PREPROCESS</span>';
  h += '<span style="width:30px"></span>';
  h += '<span style="flex:1;max-width:145px;text-align:center;font-family:\'Space Grotesk\',sans-serif;font-size:0.55rem;font-weight:700;color:var(--violet);letter-spacing:0.06em;text-transform:uppercase">🧠 TRAIN</span>';
  h += '<span style="width:30px"></span>';
  h += '<span style="flex:1;max-width:145px;text-align:center;font-family:\'Space Grotesk\',sans-serif;font-size:0.55rem;font-weight:700;color:var(--green);letter-spacing:0.06em;text-transform:uppercase">📤 POST-PROCESS</span>';
  h += '</div>';
  h += '<div class="pipeline">';
  t.stages.forEach((s,i) => {
    h += `<div class="pipe-stage ${stageZoneClasses[i]} ${i===activeStage?'active-stage':''}" onclick="setStage(${i})">`;
    h += `<span class="st-emoji">${s.emoji}</span><span class="st-name">${s.name}</span>`;
    h += `<span class="st-time">${s.time}</span><span class="st-desc">${s.desc}</span>`;
    h += '</div>';
    if (i < t.stages.length-1) h += '<span class="pipe-arrow">→</span>';
  });
  h += '</div></div>';

  // Substeps
  h += `<div class="substeps show"><h4>📋 ${stage.name} — ${stage.desc}</h4><div class="substep-grid">`;
  stage.substeps.forEach(ss => {
    h += `<div class="substep">`;
    h += `<span class="ss-num">STEP ${ss.n}</span>`;
    h += `<div class="ss-title">${ss.title}</div>`;
    if (ss.viz) h += `<div class="ss-viz">${ss.viz}</div>`;
    h += `<span class="ss-tag ${ss.tag}">${ss.tag.toUpperCase()}</span>`;
    h += `<div class="ss-code">${ss.code}</div>`;
    h += '</div>';
  });
  h += '</div></div></div>';

  document.getElementById('app').innerHTML = h;
}

render();
