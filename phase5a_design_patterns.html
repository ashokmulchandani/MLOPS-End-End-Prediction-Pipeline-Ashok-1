<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 5A: Design Patterns — Interactive Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fc;--card:#fff;--raised:#eef0f5;--border:#dde0e6;--text:#1a1d23;--tdim:#4a4f5b;--tmut:#8b909b;--violet:#5b3aa8;--vbg:#f3effc;--cyan:#007a99;--cyan-bg:#e6f4f7;--amber:#b87000;--amber-bg:#fff6e5;--green:#1a6e34;--green-bg:#e6f4ea;--red:#c62828;--magenta:#9e2a6b}
body.dark{--bg:#06090f;--card:#0d1117;--raised:#161b22;--border:#21262d;--text:#e6edf3;--tdim:#8b949e;--tmut:#484f58;--violet:#a371f7;--vbg:#a371f710;--cyan:#39d2ff;--cyan-bg:#39d2ff10;--amber:#ffb347;--amber-bg:#ffb34710;--green:#3fb950;--green-bg:#3fb95010;--red:#f85149;--magenta:#ff6ec7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;transition:background 0.3s,color 0.3s}
.theme-btn{position:fixed;top:1rem;right:1rem;z-index:10;background:var(--raised);border:1px solid var(--border);color:var(--text);padding:0.5rem 0.9rem;border-radius:8px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:0.75rem;font-weight:600}
.theme-btn:hover{border-color:var(--violet);color:var(--violet)}
.app{max-width:900px;margin:0 auto;padding:1.5rem}
.header{text-align:center;padding:1rem 0 0.5rem}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;color:var(--violet)}
.header p{color:var(--tdim);font-size:0.85rem;margin-top:0.2rem}

/* Tabs for 3 patterns */
.tabs{display:flex;gap:0.4rem;justify-content:center;margin:1rem 0;flex-wrap:wrap}
.tab{font-family:'Space Grotesk',sans-serif;font-size:0.68rem;font-weight:600;padding:0.6em 1.2em;border-radius:100px;border:2px solid var(--border);background:var(--card);color:var(--tdim);cursor:pointer;transition:0.2s}
.tab:hover{border-color:var(--violet);color:var(--violet)}
.tab.active{background:var(--violet);border-color:var(--violet);color:#fff}

/* Main content */
.content{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin:0.8rem 0}

/* Analogy + Code side-by-side */
.split{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin:1rem 0}
@media(max-width:700px){.split{grid-template-columns:1fr}}

.analogy-box{background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:1rem}
.analogy-box h3{font-family:'Space Grotesk',sans-serif;font-size:0.75rem;color:var(--amber);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.6rem}
.analogy-box .flow{display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;justify-content:center;margin:0.8rem 0}
.analogy-box .step{background:var(--card);border:2px solid var(--border);border-radius:8px;padding:0.5rem 0.7rem;text-align:center;font-size:0.7rem;font-weight:600}
.analogy-box .step.hl{border-color:var(--amber);background:var(--amber-bg)}

.code-box{background:var(--raised);border:1px solid var(--border);border-left:4px solid var(--violet);border-radius:10px;padding:0.8rem 1rem;font-family:'JetBrains Mono',monospace;font-size:0.68rem;line-height:1.7;color:var(--text);white-space:pre-wrap;overflow-x:auto}
.code-box .kw{color:var(--violet)}.code-box .str{color:var(--green)}.code-box .cm{color:var(--tmut)}

/* Visualization */
.viz{display:flex;align-items:center;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin:1rem 0;font-size:0.7rem}
.viz .vz-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:0.6rem 0.8rem;text-align:center;min-width:100px}
.viz .vz-card.factory{border-color:var(--amber);background:var(--amber-bg)}
.viz .vz-card.strategy{border-color:var(--violet);background:var(--vbg)}
.viz .vz-card.template{border-color:var(--green);background:var(--green-bg)}
.viz .vz-icon{font-size:1.5rem;display:block}
.viz .vz-name{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;font-weight:700;margin-top:0.2rem}
.viz .vz-desc{font-size:0.55rem;color:var(--tmut);margin-top:0.1rem}
.viz .vz-arrow{font-size:1.2rem;color:var(--violet);font-weight:700}

/* Mapping table */
.map-table{width:100%;border-collapse:collapse;font-size:0.7rem;margin:0.8rem 0}
.map-table th{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--tmut);padding:0.4rem 0.6rem;border-bottom:2px solid var(--border);text-align:left}
.map-table td{padding:0.4rem 0.6rem;border-bottom:1px solid var(--border);color:var(--tdim)}
.map-table .tag{font-family:'Space Grotesk',sans-serif;font-size:0.5rem;font-weight:600;padding:0.15em 0.5em;border-radius:100px}
.tag-factory{background:var(--amber-bg);color:var(--amber)}.tag-strategy{background:var(--vbg);color:var(--violet)}.tag-template{background:var(--green-bg);color:var(--green)}

/* File tree */
.tree{font-family:'JetBrains Mono',monospace;font-size:0.65rem;line-height:1.8;color:var(--tdim)}
.tree .dir{color:var(--violet);font-weight:600}.tree .pat{color:var(--amber)}.tree .file{color:var(--tdim)}

.callout{background:var(--vbg);border:1px solid rgba(91,58,168,0.15);border-radius:8px;padding:0.6rem 1rem;margin:0.6rem 0;font-size:0.75rem;text-align:center}
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()">🌙 Dark</button>
<div class="app">
<header class="header">
  <h1>Phase 5A: Design Patterns in MLOps</h1>
  <p>Same 3 patterns power the entire House Prices pipeline. Click each pattern to see how.</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="showPattern('factory', event)">🏭 Factory</button>
  <button class="tab" onclick="showPattern('strategy', event)">🎯 Strategy</button>
  <button class="tab" onclick="showPattern('basics', event)">📖 Python Basics</button>
  <button class="tab" onclick="showPattern('template', event)">📋 Template</button>
  <button class="tab" onclick="showPattern('overview', event)">🗺️ Pipeline Map</button>
  <button class="tab" onclick="showPattern('structure', event)">📁 Project Setup</button>
</div>

<div class="content" id="content"></div>
</div>

<script>
function toggleTheme(){document.body.classList.toggle('dark');document.querySelector('.theme-btn').textContent=document.body.classList.contains('dark')?'☀️ Light':'🌙 Dark';localStorage.setItem('p5a-theme',document.body.classList.contains('dark')?'dark':'light')}
if(localStorage.getItem('p5a-theme')==='dark'){document.body.classList.add('dark');document.querySelector('.theme-btn').textContent='☀️ Light'}

function showPattern(p, evt){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if (evt && evt.target) { evt.target.classList.add('active'); }
  else { document.querySelector('.tab') && document.querySelector('.tab').classList.add('active'); }
  const c=document.getElementById('content');

  if(p==='basics'){
    c.innerHTML=`
      <h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--cyan);margin-bottom:0.3rem">📖 Python Building Blocks — Explained Simply</h3>
      <p style="color:var(--tdim);font-size:0.85rem;margin-bottom:0.8rem">Before patterns, you need to understand <strong>5 words</strong>. Each one is simpler than it sounds.</p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:0.8rem 0">
        <div style="background:var(--card);border:2px solid var(--cyan);border-radius:10px;padding:0.8rem">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--cyan);font-weight:700">🏗️ CLASS = A Blueprint</div>
          <div style="font-size:0.7rem;color:var(--tdim);line-height:1.7;margin-top:0.3rem">
            <strong>Analogy:</strong> A house blueprint. The blueprint is NOT a house — it's the PLAN for building houses.<br><br>
            <code>class House:</code> = "Here's how to build a house"<br>
            <code>my_house = House()</code> = "Build me one using the blueprint"<br><br>
            <span style="color:var(--cyan)">class = blueprint. object = the actual thing built from it.</span>
          </div>
        </div>
        <div style="background:var(--card);border:2px solid var(--cyan);border-radius:10px;padding:0.8rem">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--cyan);font-weight:700">📦 OBJECT = One House Built from the Blueprint</div>
          <div style="font-size:0.7rem;color:var(--tdim);line-height:1.7;margin-top:0.3rem">
            <strong>Analogy:</strong> If <code>class House</code> is the blueprint, then <code>my_house = House()</code> creates one actual house. You can build many houses from one blueprint.<br><br>
            <code>house1 = House()</code> → 123 Main St<br>
            <code>house2 = House()</code> → 456 Oak Ave<br><br>
            <span style="color:var(--cyan)">One blueprint → unlimited houses. Same idea: one class → unlimited objects.</span>
          </div>
        </div>
        <div style="background:var(--card);border:2px solid var(--amber);border-radius:10px;padding:0.8rem">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--amber);font-weight:700">🔧 METHOD = Something the Object Can DO</div>
          <div style="font-size:0.7rem;color:var(--tdim);line-height:1.7;margin-top:0.3rem">
            <strong>Analogy:</strong> A house can <code>open_door()</code>, <code>turn_on_lights()</code>, <code>lock()</code>. These are actions.<br><br>
            <code>df.fillna(0)</code> = "DataFrame, fill your empty spots with 0"<br>
            <code>df.dropna()</code> = "DataFrame, drop rows with empty spots"<br><br>
            <span style="color:var(--amber)">method = action. It's a function that belongs to a class.</span>
          </div>
        </div>
        <div style="background:var(--card);border:2px solid var(--amber);border-radius:10px;padding:0.8rem">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--amber);font-weight:700">🎛️ HANDLER = A Manager That Delegates</div>
          <div style="font-size:0.7rem;color:var(--tdim);line-height:1.7;margin-top:0.3rem">
            <strong>Analogy:</strong> A hotel front desk. You say "I need my room cleaned." The front desk doesn't clean — it CALLS the housekeeping staff.<br><br>
            <code>handler.handle_missing_values(df)</code><br>
            = "Handler, fix the missing values"<br>
            → Handler calls <code>strategy.handle(df)</code><br><br>
            <span style="color:var(--amber)">handler = middleman. It doesn't do the work — it delegates.</span>
          </div>
        </div>
        <div style="background:var(--card);border:2px solid var(--violet);border-radius:10px;padding:0.8rem;grid-column:1/-1">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--violet);font-weight:700">📋 ABC (Abstract Base Class) = A Contract — "You MUST have this method"</div>
          <div style="font-size:0.7rem;color:var(--tdim);line-height:1.7;margin-top:0.3rem">
            <strong>Analogy:</strong> A job description. "All chefs MUST know how to <code>cook()</code>. Italian chef, Chinese chef — doesn't matter. If you can't <code>cook()</code>, you're not hired."<br><br>
            <code>class DataIngestor(ABC):</code> = "Every ingestor MUST have an <code>ingest()</code> method"<br>
            <code>class ZipDataIngestor(DataIngestor):</code> = "I'm an ingestor, and here's MY version of <code>ingest()</code>"<br><br>
            <span style="color:var(--violet)">ABC = a promise. "I guarantee every subclass has this method."</span>
          </div>
        </div>
      </div>

      <h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--violet);margin:1rem 0 0.4rem">🔗 How These 5 Words Connect in Our Code</h4>
      <div class="code-box"><span class="cm"># CLASS (blueprint) + ABC (contract)</span>
<span class="kw">class</span> MissingValueHandlingStrategy(<span style="color:var(--violet)">ABC</span>):          <span class="cm">← "Every strategy MUST have handle()"</span>
    <span class="kw">@abstractmethod</span>
    <span class="kw">def</span> <span style="color:var(--amber)">handle</span>(self, df):                          <span class="cm">← METHOD: what the strategy can DO</span>
        <span class="kw">pass</span>

<span class="cm"># OBJECT (actual thing) created from the CLASS blueprint</span>
strategy = FillMissingValuesStrategy(<span class="str">"median"</span>)  <span class="cm">← OBJECT: one specific strategy</span>

<span class="cm"># HANDLER (manager) DELEGATES to the strategy OBJECT</span>
handler = MissingValueHandler()                <span class="cm">← OBJECT: the manager</span>
handler.set_strategy(strategy)                 <span class="cm">← "Use this strategy please"</span>
handler.handle_missing_values(df)              <span class="cm">← HANDLER delegates → strategy.handle(df)</span></div>

      <div class="callout"><strong>🧠 BOTTOM LINE:</strong> You don't need to be a Python expert. You need to recognize these 5 words when you see them. <strong>class = blueprint, object = thing, method = action, handler = manager, ABC = contract.</strong> That's it.</div>`;
    c.innerHTML=`
      <h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--amber);margin-bottom:0.3rem">🏭 Factory Pattern — The "Auto-Detect" Pattern</h3>
      <p style="color:var(--tdim);font-size:0.85rem;margin-bottom:1rem"><strong>What problem does it solve?</strong> Your data arrives in different formats — ZIP files, CSV files, Parquet files. You don't want to remember which class handles which format. The Factory remembers for you.</p>

      <div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:12px;padding:1.2rem;margin:1rem 0">
        <h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.75rem;color:var(--amber);margin-bottom:0.8rem;text-align:center">🧠 BUILD YOUR INTUITION — Before vs After</h4>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:0.6rem;align-items:center">
          <div style="background:var(--red-bg, #ffebe9);border:1px solid var(--red);border-radius:8px;padding:0.8rem;text-align:center">
            <div style="font-family:'Space Grotesk',sans-serif;font-size:0.65rem;color:var(--red);font-weight:700;margin-bottom:0.4rem">❌ WITHOUT Factory</div>
            <div style="font-size:0.65rem;color:var(--tdim);line-height:1.8">
              if file is ZIP:<br>→ <strong>YOU</strong> must remember<br>→ to call ZipDataIngestor()<br><br>
              if file is CSV:<br>→ <strong>YOU</strong> must remember<br>→ to call CsvDataIngestor()<br><br>
              <span style="color:var(--red)">Every new format =<br>YOU update ALL the code</span>
            </div>
          </div>
          <div style="font-size:1.5rem;font-weight:700;color:var(--green)">→</div>
          <div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.8rem;text-align:center">
            <div style="font-family:'Space Grotesk',sans-serif;font-size:0.65rem;color:var(--green);font-weight:700;margin-bottom:0.4rem">✅ WITH Factory</div>
            <div style="font-size:0.65rem;color:var(--tdim);line-height:1.8">
              Just say:<br><strong>"data.zip"</strong><br><br>
              Factory auto-detects<br><strong>".zip"</strong> extension<br><br>
              <span style="color:var(--green)">Routes to ZipDataIngestor<br>YOU write ZERO if-else!</span>
            </div>
          </div>
        </div>
      </div>

      <h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--violet);margin:1rem 0 0.4rem">📦 WHERE exactly does this happen?</h4>
      <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;justify-content:center;margin:0.8rem 0;font-size:0.72rem">
        <div style="background:var(--card);border:2px solid var(--border);border-radius:10px;padding:0.7rem;text-align:center"><strong>Step 1<br>of Pipeline</strong><br><span style="color:var(--tmut);font-size:0.6rem">Data Ingestion</span></div>
        <span style="font-size:1.5rem;color:var(--violet)">→</span>
        <div style="background:var(--amber-bg);border:2px solid var(--amber);border-radius:10px;padding:0.7rem;text-align:center"><strong>Factory</strong><br><span style="color:var(--tmut);font-size:0.6rem">src/ingest_data.py</span></div>
        <span style="font-size:1.5rem;color:var(--violet)">→</span>
        <div style="background:var(--card);border:2px solid var(--border);border-radius:10px;padding:0.7rem;text-align:center"><strong>DataFrame</strong><br><span style="color:var(--tmut);font-size:0.6rem">2930 rows × 82 cols</span></div>
        <span style="font-size:1.5rem;color:var(--violet)">→</span>
        <div style="background:var(--card);border:2px solid var(--border);border-radius:10px;padding:0.7rem;text-align:center"><strong>Rest of<br>Pipeline</strong><br><span style="color:var(--tmut);font-size:0.6rem">6 more steps</span></div>
      </div>

      <h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--violet);margin:1rem 0 0.4rem">👤 WHO writes this code?</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:0.8rem 0">
        <div style="background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:0.8rem">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:0.65rem;color:var(--green);font-weight:700;margin-bottom:0.3rem">✅ WE write ONCE (setup)</div>
          <div style="font-size:0.65rem;color:var(--tdim);line-height:1.7">The 3 classes: <strong>DataIngestor (ABC)</strong>, <strong>ZipDataIngestor</strong>, and <strong>DataIngestorFactory</strong>. Written ONCE at project setup. ~50 lines of code total.</div>
        </div>
        <div style="background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:0.8rem">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:0.65rem;color:var(--amber);font-weight:700;margin-bottom:0.3rem">🤖 Factory auto-handles (every time)</div>
          <div style="font-size:0.65rem;color:var(--tdim);line-height:1.7">Every time you run the pipeline: Factory auto-detects file type → creates correct ingestor → returns DataFrame. <strong>ONE line of code.</strong> No if-else. No manual checks.</div>
        </div>
      </div>

      <div class="code-box"><span class="cm"># This is ALL you write to use the Factory (every time):</span>
df = DataIngestorFactory.get_data_ingestor(<span class="str">".zip"</span>).ingest(<span class="str">"data.zip"</span>)

<span class="cm"># That's it. One line. Factory does the rest.</span>
<span class="cm"># If tomorrow the file is .parquet, same line — just change the extension.</span></div>

      <div style="background:var(--green-bg);border:2px solid var(--green);border-radius:10px;padding:0.8rem 1rem;margin:1rem 0;text-align:center">
        <div style="font-family:'Space Grotesk',sans-serif;font-size:0.7rem;color:var(--green);font-weight:700;margin-bottom:0.3rem">❓ WHO WROTE THIS CODE?</div>
        <div style="font-size:0.75rem;color:var(--tdim);line-height:1.7">
          <strong>It's ALREADY written for you</strong> in <code style="background:var(--raised);padding:0.1em 0.4em;border-radius:3px">prices-predictor-system/src/ingest_data.py</code><br>
          Your job: <strong>UNDERSTAND it</strong>, not rewrite it. Open the file, read it, see the pattern.<br>
          When you build your OWN project later → you write similar code following this template.
        </div>
      </div>

      <h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;color:var(--violet);margin:1rem 0 0.4rem">📝 The Code (already in your project at src/ingest_data.py)</h4>
      <div class="code-box"><span class="cm"># Step 1: Define the PRODUCT interface (the contract)</span>
<span class="kw">from</span> abc <span class="kw">import</span> ABC, abstractmethod
<span class="kw">class</span> DataIngestor(ABC):
    <span class="kw">@abstractmethod</span>
    <span class="kw">def</span> ingest(self, file_path: str) -> pd.DataFrame:
        <span class="kw">pass</span>

<span class="cm"># Step 2: Implement CONCRETE products for each file type</span>
<span class="kw">class</span> ZipDataIngestor(DataIngestor):
    <span class="kw">def</span> ingest(self, file_path: str):
        <span class="kw">import</span> zipfile, os
        extract_path = <span class="str">"extracted_data"</span>
        <span class="kw">with</span> zipfile.ZipFile(file_path, <span class="str">"r"</span>) <span class="kw">as</span> zip_ref:
            zip_ref.extractall(extract_path)
        csv_files = [f <span class="kw">for</span> f <span class="kw">in</span> os.listdir(extract_path) <span class="kw">if</span> f.endswith(<span class="str">".csv"</span>)]
        <span class="kw">return</span> pd.read_csv(os.path.join(extract_path, csv_files[0]))

<span class="cm"># Step 3: The FACTORY — decides WHICH class to create</span>
<span class="kw">class</span> DataIngestorFactory:
    <span class="kw">@staticmethod</span>
    <span class="kw">def</span> get_data_ingestor(file_extension: str) -> DataIngestor:
        <span class="kw">if</span> file_extension == <span class="str">".zip"</span>:
            <span class="kw">return</span> ZipDataIngestor()
        <span class="kw">raise</span> ValueError(<span class="str">f"No ingestor for: {file_extension}"</span>)

<span class="cm"># Step 4: USE it — everywhere in the pipeline, just ONE line</span>
file_ext = os.path.splitext(<span class="str">"data/archive.zip"</span>)[1]  <span class="cm"># → ".zip"</span>
ingestor = DataIngestorFactory.get_data_ingestor(file_ext)
df = ingestor.ingest(<span class="str">"data/archive.zip"</span>)  <span class="cm"># → 2930 rows × 82 cols</span></div>

      <div class="callout"><strong>🧠 Remember:</strong> Factory = "I don't want to think about WHICH class to create." <strong>You wrote these ~50 lines ONCE. They run automatically forever. To add .parquet support → add ONE class + ONE if-branch.</strong></div>`;

<span class="kw">from</span> abc <span class="kw">import</span> ABC, abstractmethod
<span class="kw">class</span> MissingValueHandlingStrategy(ABC):
    <span class="kw">@abstractmethod</span>
    <span class="kw">def</span> handle(self, df: pd.DataFrame) -> pd.DataFrame:
        <span class="kw">pass</span>

<span class="cm"># Step 2: CONCRETE strategies (the options you can swap between)</span>
<span class="kw">class</span> DropMissingValuesStrategy(MissingValueHandlingStrategy):
    <span class="kw">def</span> handle(self, df):
        <span class="kw">return</span> df.dropna()  <span class="cm"># Just delete rows with nulls</span>

<span class="kw">class</span> FillMissingValuesStrategy(MissingValueHandlingStrategy):
    <span class="kw">def</span> __init__(self, method=<span class="str">"median"</span>):
        self.method = method  <span class="cm"># "mean", "median", "mode", or "constant"</span>
    <span class="kw">def</span> handle(self, df):
        <span class="kw">if</span> self.method == <span class="str">"median"</span>: <span class="kw">return</span> df.fillna(df.median())
        <span class="kw">if</span> self.method == <span class="str">"mean"</span>:   <span class="kw">return</span> df.fillna(df.mean())
        <span class="kw">if</span> self.method == <span class="str">"mode"</span>:   <span class="kw">return</span> df.fillna(df.mode().iloc[0])
        <span class="kw">return</span> df.fillna(self.method)  <span class="cm"># constant value</span>

<span class="cm"># Step 3: CONTEXT — the handler that DELEGATES to the strategy</span>
<span class="kw">class</span> MissingValueHandler:
    <span class="kw">def</span> set_strategy(self, strategy: MissingValueHandlingStrategy):

    <span class="kw">def</span> handle_missing_values(self, df):
        <span class="kw">return</span> self.strategy.handle(df)  <span class="cm"># ← THIS is the delegation!</span>

<span class="cm"># Step 4: USE it — swap strategies in ONE line</span>
