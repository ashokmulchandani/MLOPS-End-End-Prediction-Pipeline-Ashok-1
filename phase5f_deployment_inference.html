<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 5F: Deployment Pipeline + Inference — Interactive Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fc;--card:#fff;--raised:#eef0f5;--border:#dde0e6;--text:#1a1d23;--tdim:#4a4f5b;--tmut:#8b909b;--violet:#5b3aa8;--vbg:#f3effc;--cyan:#007a99;--cyan-bg:#e6f4f7;--amber:#b87000;--amber-bg:#fff6e5;--green:#1a6e34;--green-bg:#e6f4ea;--red:#c62828;--magenta:#9e2a6b}
body.dark{--bg:#06090f;--card:#0d1117;--raised:#161b22;--border:#21262d;--text:#e6edf3;--tdim:#8b949e;--tmut:#484f58;--violet:#a371f7;--vbg:#a371f710;--cyan:#39d2ff;--cyan-bg:#39d2ff10;--amber:#ffb347;--amber-bg:#ffb34710;--green:#3fb950;--green-bg:#3fb95010;--red:#f85149;--magenta:#ff6ec7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;transition:background 0.3s,color 0.3s}
.theme-btn{position:fixed;top:1rem;right:1rem;z-index:10;background:var(--raised);border:1px solid var(--border);color:var(--text);padding:0.5rem 0.9rem;border-radius:8px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:0.75rem;font-weight:600}
.theme-btn:hover{border-color:var(--violet);color:var(--violet)}
.app{max-width:950px;margin:0 auto;padding:1.5rem}
.header{text-align:center;padding:1rem 0 0.3rem}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;color:var(--violet)}
.header p{color:var(--tdim);font-size:0.85rem;margin-top:0.2rem}
.tabs{display:flex;gap:0.35rem;justify-content:center;margin:0.8rem 0;flex-wrap:wrap}
.tab{font-family:'Space Grotesk',sans-serif;font-size:0.58rem;font-weight:600;padding:0.5em 1em;border-radius:100px;border:1.5px solid var(--border);background:var(--card);color:var(--tdim);cursor:pointer;transition:0.15s}
.tab:hover{border-color:var(--violet);color:var(--violet)}
.tab.active{background:var(--violet);border-color:var(--violet);color:#fff}
.content{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin:0.6rem 0}
.code-box{background:#1e1e1e;border:1px solid #333;border-left:4px solid var(--violet);border-radius:8px;padding:0.8rem 1rem;font-family:'JetBrains Mono',monospace;font-size:0.66rem;line-height:1.7;color:#d4d4d4;white-space:pre-wrap;overflow-x:auto;margin:0.6rem 0}
.code-box .kw{color:#569cd6}.code-box .str{color:#ce9178}.code-box .cm{color:#6a9955}.code-box .fn{color:#c586c0}.code-box .cls{color:#4ec9b0}.code-box .num{color:#b5cea8}.code-box .deco{color:#c586c0}
.callout{background:var(--vbg);border:1px solid rgba(91,58,168,0.15);border-radius:8px;padding:0.6rem 1rem;margin:0.6rem 0;font-size:0.78rem;text-align:center}
.viz-row{display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;justify-content:center;margin:0.8rem 0;font-size:0.62rem}
.viz-box{background:var(--card);border:2px solid var(--border);border-radius:8px;padding:0.5rem 0.7rem;text-align:center;min-width:80px}
.viz-box.in{border-color:var(--amber);background:var(--amber-bg)}.viz-box.proc{border-color:var(--violet);background:var(--vbg)}.viz-box.out{border-color:var(--green);background:var(--green-bg)}
.viz-arrow{font-size:1rem;color:var(--violet)}
.beginner-box{background:var(--amber-bg);border:2px solid var(--amber);border-radius:8px;padding:0.6rem 0.8rem;margin:0.6rem 0;font-size:0.68rem}
.beginner-box strong{color:var(--amber)}
.anatomy-subtab{font-family:'Space Grotesk',sans-serif;font-size:0.52rem;font-weight:600;padding:0.4em 0.8em;border-radius:100px;border:1.5px solid var(--border);background:var(--card);color:var(--tdim);cursor:pointer;transition:0.15s}
.anatomy-subtab:hover{border-color:var(--violet);color:var(--violet)}
.anatomy-subtab.active{background:var(--violet);border-color:var(--violet);color:#fff}
.table-wrap{overflow-x:auto;margin:0.6rem 0}
.table-wrap table{width:100%;border-collapse:collapse;font-size:0.6rem;font-family:Inter,sans-serif;text-align:left}
.table-wrap th{border-bottom:2px solid var(--violet);padding:0.3rem;color:var(--violet)}
.table-wrap td{padding:0.3rem}
.table-wrap tr:nth-child(even){background:var(--raised)}
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()">🌙 Dark</button>
<div class="app">
<header class="header">
  <h1>Phase 5F: Deployment Pipeline + Inference</h1>
  <p>From trained model to REST API to real predictions. The final piece of the MLOps puzzle.</p>
</header>

<div class="tabs" id="main-tabs">
  <button class="tab active" onclick="showTab('overview',event)">🗺️ Overview</button>
  <button class="tab" onclick="showTab('deploy',event)">🚀 Deployment Pipeline</button>
  <button class="tab" onclick="showTab('infer',event)">🧠 Inference Pipeline</button>
  <button class="tab" onclick="showTab('anatomy',event)">🔬 Code Anatomy</button>
  <button class="tab" onclick="showTab('usage',event)">▶️ How to Use</button>
  <button class="tab" onclick="showTab('structure',event)">📁 Project Structure</button>
</div>
<div class="content" id="content"></div>
</div>
<script>
"use strict";

// ============================================================================
// THEME TOGGLE
// ============================================================================
function toggleTheme(){
  document.body.classList.toggle('dark');
  document.querySelector('.theme-btn').textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
  localStorage.setItem('p5f-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
if(localStorage.getItem('p5f-theme') === 'dark'){
  document.body.classList.add('dark');
  document.querySelector('.theme-btn').textContent = '☀️ Light';
}

// ============================================================================
// VS CODE SYNTAX HIGHLIGHTING — applies colors to code boxes
// ============================================================================
function highlightCode(html){
  // Replace placeholder tokens with colored spans
  return html
    .replace(/\[\[KW:(.*?)\]\]/g, '<span class="kw">$1</span>')
    .replace(/\[\[STR:(.*?)\]\]/g, '<span class="str">$1</span>')
    .replace(/\[\[CM:(.*?)\]\]/g, '<span class="cm">$1</span>')
    .replace(/\[\[FN:(.*?)\]\]/g, '<span class="fn">$1</span>')
    .replace(/\[\[CLS:(.*?)\]\]/g, '<span class="cls">$1</span>')
    .replace(/\[\[NUM:(.*?)\]\]/g, '<span class="num">$1</span>')
    .replace(/\[\[DECO:(.*?)\]\]/g, '<span class="deco">$1</span>');
}

// ============================================================================
// MAIN TAB SWITCHER
// ============================================================================
function showTab(p, evt){
  var tabs = document.querySelectorAll('#main-tabs .tab');
  for(var i = 0; i < tabs.length; i++){ tabs[i].classList.remove('active'); }
  if(evt && evt.target){ evt.target.classList.add('active'); }
  else { tabs[0].classList.add('active'); }

  var c = document.getElementById('content');
  if(!c){ return; }

  if(p === 'overview'){ c.innerHTML = buildOverview(); }
  else if(p === 'deploy'){ c.innerHTML = buildDeploy(); }
  else if(p === 'infer'){ c.innerHTML = buildInfer(); }
  else if(p === 'anatomy'){ c.innerHTML = buildAnatomy(); }
  else if(p === 'usage'){ c.innerHTML = buildUsage(); }
  else if(p === 'structure'){ c.innerHTML = buildStructure(); }
}

// ============================================================================
// OVERVIEW TAB
// ============================================================================
function buildOverview(){
  var h = '';
  h += '<h3 style="font-family:\'Space Grotesk\',sans-serif;font-size:1.1rem;color:var(--violet);margin-bottom:0.3rem">🗺️ Where Deployment Fits in the MLOps Pipeline</h3>';
  h += '<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:1rem">After training and evaluating a model (Phase 5E), the <strong>deployment pipeline</strong> wraps it as a REST API so external systems can send data and get predictions back. This closes the loop: <strong>data → train → evaluate → deploy → predict</strong>.</p>';

  // Two-pipeline architecture
  h += '<div style="background:var(--vbg);border:2px solid var(--violet);border-radius:12px;padding:1rem;margin:1rem 0">';
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.72rem;color:var(--violet);margin-bottom:0.6rem;text-align:center">🏗️ TWO Pipelines Working Together</h4>';
  h += '<div class="viz-row" style="flex-direction:column;gap:0.6rem">';
  h += '<div class="viz-row">';
  h += '<div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.5rem 0.7rem;text-align:center;font-size:0.6rem"><strong>PIPELINE 1</strong><br>Training Pipeline<br><span style="color:var(--tmut)">7 steps</span><br><span style="color:var(--tmut)">data → model</span></div>';
  h += '<span class="viz-arrow">→</span>';
  h += '<div class="viz-box proc" style="font-size:0.6rem"><strong>PIPELINE 2</strong><br>Deployment Pipeline<br><span style="color:var(--tmut)">train → deploy → infer</span></div>';
  h += '<span class="viz-arrow">→</span>';
  h += '<div class="viz-box out" style="font-size:0.6rem"><strong>RESULT</strong><br>REST API @<br><span style="color:var(--green)">localhost:8000</span></div>';
  h += '</div></div></div>';

  // What deployment means
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.75rem;color:var(--violet);margin:0.8rem 0 0.3rem">🎯 What "Deployment" Means in This System</h4>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin:0.6rem 0;font-size:0.6rem">';
  h += '<div style="background:var(--vbg);border:2px solid var(--violet);border-radius:8px;padding:0.6rem;text-align:center"><div style="font-size:1.3rem">📦</div><strong>MLflow Model Server</strong><br><span style="color:var(--tmut)">MLflow wraps the trained Pipeline as a REST server. Port 8000. JSON in, prediction out.</span></div>';
  h += '<div style="background:var(--amber-bg);border:2px solid var(--amber);border-radius:8px;padding:0.6rem;text-align:center"><div style="font-size:1.3rem">🔄</div><strong>Continuous Deployment</strong><br><span style="color:var(--tmut)">Every time you retrain, the model is automatically redeployed. No manual copy-paste of files.</span></div>';
  h += '<div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.6rem;text-align:center"><div style="font-size:1.3rem">🔌</div><strong>Inference Anywhere</strong><br><span style="color:var(--tmut)">Any app (web, mobile, another service) can send a POST request and get a price prediction.</span></div>';
  h += '</div>';

  // Beginner analogy
  h += '<div class="beginner-box"><strong>🧑‍🏫 BEGINNER ANALOGY — What is "Deployment"?</strong><br>';
  h += 'Training = you practicing cooking in your kitchen.<br>';
  h += 'Deployment = you open a <strong>restaurant</strong> (the API). Customers (apps) walk in, place orders (send data), and get food (predictions).<br>';
  h += 'You keep improving your recipes (retrain), and the restaurant automatically starts serving the new dishes (continuous deployment).';
  h += '</div>';

  // File inventory table
  h += '<div style="background:var(--card);border:2px solid var(--violet);border-radius:10px;padding:1rem;margin:1rem 0">';
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.72rem;color:var(--violet);margin-bottom:0.6rem;text-align:center">📁 All Files Involved in Deployment — Phase 5F</h4>';
  h += '<div class="table-wrap"><table>';
  h += '<tr><th>File</th><th>Role</th><th>Type</th></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">pipelines/deployment_pipeline.py</td><td>Orchestrates BOTH pipelines (deploy + inference)</td><td style="color:var(--amber)">ZenML @pipeline</td></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">run_deployment.py</td><td>CLI entry point — "python run_deployment.py"</td><td style="color:var(--amber)">Click CLI</td></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">steps/dynamic_importer.py</td><td>Simulates incoming data (replace with real API)</td><td style="color:var(--violet)">ZenML @step</td></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">steps/prediction_service_loader.py</td><td>Finds the running MLflow prediction server</td><td style="color:var(--violet)">ZenML @step</td></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">steps/predictor.py</td><td>Sends data to server, gets prediction back</td><td style="color:var(--violet)">ZenML @step</td></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">sample_predict.py</td><td>Test: raw HTTP call to the deployed server</td><td style="color:var(--green)">Plain Python</td></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">steps/model_loader.py</td><td>Loads production model from ZenML registry</td><td style="color:var(--violet)">ZenML @step</td></tr>';
  h += '<tr><td style="font-weight:700;font-family:\'JetBrains Mono\',monospace;color:var(--violet)">config.yaml</td><td>Model registry config (name, license, tags)</td><td style="color:var(--tmut)">YAML config</td></tr>';
  h += '</table></div></div>';

  h += '<div class="callout"><strong>🧠 KEY:</strong> Phase 5F = TWO pipelines. <strong>Pipeline 1 (continuous_deployment):</strong> trains → deploys model as REST API. <strong>Pipeline 2 (inference):</strong> loads data → finds server → predicts. The <strong>MLflow Model Deployer</strong> is the bridge — it takes any trained model and wraps it as a prediction server.</div>';
  return h;
}

// ============================================================================
// DEPLOY TAB
// ============================================================================
function buildDeploy(){
  var h = '';
  h += '<h3 style="font-family:\'Space Grotesk\',sans-serif;font-size:1.1rem;color:var(--cyan);margin-bottom:0.3rem">🚀 The Deployment Pipeline</h3>';
  h += '<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:0.8rem"><strong>File:</strong> <code>pipelines/deployment_pipeline.py</code>. This file defines TWO pipelines. Pipeline 1 trains AND deploys the model as a live REST API in one shot.</p>';

  // Flow diagram
  h += '<div style="background:var(--cyan-bg);border:2px solid var(--cyan);border-radius:12px;padding:1rem;margin:1rem 0">';
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.72rem;color:var(--cyan);margin-bottom:0.5rem;text-align:center">🚀 Pipeline 1: continuous_deployment_pipeline</h4>';
  h += '<div class="viz-row">';
  h += '<div class="viz-box in"><strong>STEP 1</strong><br>ml_pipeline()<br><span style="color:var(--tmut)">Full 7-step train</span></div>';
  h += '<span class="viz-arrow">→</span>';
  h += '<div class="viz-box proc"><strong>STEP 2</strong><br>mlflow_model_deployer_step<br><span style="color:var(--tmut)">Wrap as REST API</span></div>';
  h += '<span class="viz-arrow">→</span>';
  h += '<div class="viz-box out"><strong>OUTPUT</strong><br>Live server @<br><span style="color:var(--green)">localhost:8000</span></div>';
  h += '</div></div>';

  // Beginner: what is @pipeline
  h += '<div class="beginner-box"><strong>🧑‍🏫 What is @pipeline?</strong><br>';
  h += '<code>@pipeline</code> is a ZenML <strong>decorator</strong>. Think of it like a wrapper: "ZenML, please watch everything this function calls, track all the steps, and log them." Without <code>@pipeline</code> it\'s just a normal Python function. <strong>With</strong> <code>@pipeline</code>, ZenML knows this is a pipeline and tracks every <code>@step</code>-decorated function called inside it.</div>';

  // deployment_pipeline.py code
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 The Deployment Pipeline Code — Line by Line</h4>';
  h += '<div class="code-box">';
  h += '<span class="cm"># FILE: pipelines/deployment_pipeline.py (38 lines)</span>\n';
  h += '<span class="cm">#</span>\n';
  h += '<span class="cm"># ╔══════════════════════════════════════════════════╗</span>\n';
  h += '<span class="cm"># ║  IMPORTS                                          ║</span>\n';
  h += '<span class="cm"># ╚══════════════════════════════════════════════════╝</span>\n\n';
  h += '<span class="kw">import</span> os\n\n';
  h += '<span class="cm">#  ┌── TRAINING pipeline — the 7-step pipeline from Phase 5E</span>\n';
  h += '<span class="kw">from</span> pipelines.training_pipeline <span class="kw">import</span> ml_pipeline\n\n';
  h += '<span class="cm">#  ┌── DEPLOYMENT steps — each is a @step-decorated function</span>\n';
  h += '<span class="kw">from</span> steps.dynamic_importer <span class="kw">import</span> dynamic_importer      <span class="cm"># Simulates incoming data</span>\n';
  h += '<span class="kw">from</span> steps.model_loader <span class="kw">import</span> model_loader                <span class="cm"># Loads model from registry</span>\n';
  h += '<span class="kw">from</span> steps.prediction_service_loader <span class="kw">import</span> prediction_service_loader  <span class="cm"># Finds running server</span>\n';
  h += '<span class="kw">from</span> steps.predictor <span class="kw">import</span> predictor                    <span class="cm"># Sends data, gets prediction</span>\n\n';
  h += '<span class="cm">#  ┌── ZenML core</span>\n';
  h += '<span class="kw">from</span> zenml <span class="kw">import</span> pipeline\n\n';
  h += '<span class="cm">#  ┌── THE KEY IMPORT — MLflow\'s built-in deploy step!</span>\n';
  h += '<span class="cm">#  │   This is NOT something we wrote. It comes from ZenML\'s MLflow integration.</span>\n';
  h += '<span class="cm">#  │   It takes a trained model and wraps it as a live prediction server.</span>\n';
  h += '<span class="kw">from</span> zenml.integrations.mlflow.steps <span class="kw">import</span> mlflow_model_deployer_step\n';
  h += '</div>';

  // Pipeline 1
  h += '<div class="code-box">';
  h += '<span class="cm"># ╔══════════════════════════════════════════════════╗</span>\n';
  h += '<span class="cm"># ║  PIPELINE 1: Continuous Deployment               ║</span>\n';
  h += '<span class="cm"># ╚══════════════════════════════════════════════════╝</span>\n\n';
  h += '<span class="deco">@pipeline</span>\n';
  h += '<span class="kw">def</span> <span class="fn">continuous_deployment_pipeline</span>():\n';
  h += '    <span class="str">"""Run a training job and deploy an MLflow model deployment."""</span>\n\n';
  h += '    <span class="cm"># STEP 1: Run the ENTIRE 7-step training pipeline</span>\n';
  h += '    <span class="cm"># ml_pipeline() = ingest → impute → feature → outlier → split → model → eval</span>\n';
  h += '    <span class="cm"># Returns: the trained sklearn Pipeline (preprocessor + model)</span>\n';
  h += '    trained_model = ml_pipeline()\n\n';
  h += '    <span class="cm"># STEP 2: Deploy the trained model as a REST API</span>\n';
  h += '    <span class="cm"># workers=3 → 3 parallel workers for handling requests</span>\n';
  h += '    <span class="cm"># deploy_decision=True → ALWAYS deploy (no approval gate)</span>\n';
  h += '    <span class="cm"># model=trained_model → the model we just trained</span>\n';
  h += '    mlflow_model_deployer_step(workers=<span class="num">3</span>, deploy_decision=<span class="kw">True</span>, model=trained_model)\n';
  h += '</div>';

  // Pipeline 2
  h += '<div class="code-box">';
  h += '<span class="cm"># ╔══════════════════════════════════════════════════╗</span>\n';
  h += '<span class="cm"># ║  PIPELINE 2: Batch Inference                      ║</span>\n';
  h += '<span class="cm"># ╚══════════════════════════════════════════════════╝</span>\n\n';
  h += '<span class="cm"># enable_cache=False = "ALWAYS re-run — do not reuse old results"</span>\n';
  h += '<span class="deco">@pipeline</span>(enable_cache=<span class="kw">False</span>)\n';
  h += '<span class="kw">def</span> <span class="fn">inference_pipeline</span>():\n';
  h += '    <span class="str">"""Run a batch inference job with data loaded from an API."""</span>\n\n';
  h += '    <span class="cm"># STEP 1: Get data (simulated API call / DB query)</span>\n';
  h += '    batch_data = dynamic_importer()\n\n';
  h += '    <span class="cm"># STEP 2: Find the running prediction server</span>\n';
  h += '    <span class="cm"># Searches by pipeline_name + step_name = unique identifier</span>\n';
  h += '    model_deployment_service = prediction_service_loader(\n';
  h += '        pipeline_name=<span class="str">"continuous_deployment_pipeline"</span>,\n';
  h += '        step_name=<span class="str">"mlflow_model_deployer_step"</span>,\n';
  h += '    )\n\n';
  h += '    <span class="cm"># STEP 3: Send data → receive predictions</span>\n';
  h += '    predictor(service=model_deployment_service, input_data=batch_data)\n';
  h += '</div>';

  // Key bridge
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">🔑 The KEY Bridge: mlflow_model_deployer_step</h4>';
  h += '<div style="background:var(--card);border:2px solid var(--cyan);border-radius:10px;padding:0.8rem;margin:0.6rem 0">';
  h += '<div style="font-size:0.62rem;color:var(--tdim);line-height:1.8">';
  h += '<strong style="color:var(--cyan)">This ONE function</strong> takes ANY trained sklearn Pipeline and:';
  h += '<ul style="margin:0.4rem 0 0.4rem 1.2rem;font-size:0.58rem">';
  h += '<li>Wraps it in an MLflow model server</li>';
  h += '<li>Starts it on port <strong style="color:var(--violet)">8000</strong></li>';
  h += '<li>Exposes a <strong style="color:var(--violet)">REST API endpoint</strong>: POST /invocations</li>';
  h += '<li>Makes it discoverable by <code>prediction_service_loader</code></li>';
  h += '</ul>';
  h += '<span style="color:var(--tmut)">It\'s a pre-built ZenML+MLflow integration. We didn\'t write the server code — ZenML and MLflow handle that for us.</span>';
  h += '</div></div>';

  h += '<div class="beginner-box"><strong>🧑‍🏫 What are "workers" and why 3?</strong><br>';

  h += '    model_deployer = MLFlowModelDeployer.get_active_model_deployer()\n\n';
  h += '    <span class="cm"># SEARCH for running servers matching these identifiers</span>\n';

  h += '        pipeline_step_name=step_name,\n';
  h += '    )\n\n';
  h += '    <span class="cm"># CRASH if no server found (can\'t predict without one)</span>\n';
  h += '    <span class="kw">if not</span> existing_services:\n';

  h += '        )\n\n';
  h += '    <span class="cm"># Return the FIRST matching server</span>\n';
  h += '    <span class="kw">return</span> existing_services[<span class="num">0</span>]\n';
  h += '</div>';

  h += '<div class="beginner-box"><strong>🧑‍🏫 What is MLFlowDeploymentService?</strong><br>It\'s a ZenML object that wraps a running MLflow server. It knows the server\'s URL, how to start/stop it, and how to send predictions. You don\'t need to know the URL yourself — the service object handles that. Think of it like a <strong>remote control</strong> for the prediction server.</div>';

  // Step 3: predictor
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 Step 3: predictor.py — "Send data, get prediction"</h4>';

  h += '<span class="kw">def</span> <span class="fn">predictor</span>(\n';
  h += '    service: MLFlowDeploymentService,   <span class="cm"># The running server (from step 2)</span>\n';
  h += '    input_data: <span class="cls">str</span>,                  <span class="cm"># JSON string (from step 1)</span>\n';
  h += ') -> np.ndarray:\n';
  h += '    <span class="str">"""Run an inference request against a prediction service."""</span>\n\n';
  h += '    <span class="cm"># PHASE 1: Start the service (NOP if already running)</span>\n';
  h += '    service.start(timeout=<span class="num">10</span>)\n\n';
  h += '    <span class="cm"># PHASE 2: Parse the JSON input</span>\n';
  h += '    data = json.loads(input_data)\n';
  h += '    data.pop(<span class="str">"columns"</span>, <span class="kw">None</span>)\n';
  h += '    data.pop(<span class="str">"index"</span>, <span class="kw">None</span>)\n\n';
  h += '    <span class="cm"># PHASE 3: Build the DataFrame with 37 expected columns</span>\n';
  h += '    expected_columns = [\n';
  h += '        <span class="str">"Order"</span>, <span class="str">"PID"</span>, <span class="str">"MS SubClass"</span>, <span class="str">"Lot Frontage"</span>,\n';
  h += '        <span class="str">"Lot Area"</span>, <span class="str">"Overall Qual"</span>, <span class="cm"># ... 32 more cols ...</span>\n';
  h += '        <span class="str">"Yr Sold"</span>,\n';
  h += '    ]\n';
  h += '    df = pd.DataFrame(data[<span class="str">"data"</span>], columns=expected_columns)\n\n';
  h += '    <span class="cm"># PHASE 4: Convert to format MLflow expects</span>\n';
  h += '    json_list = json.loads(json.dumps(list(df.T.to_dict().values())))\n';
  h += '    data_array = np.array(json_list)\n\n';
  h += '    <span class="cm"># PHASE 5: THE ACTUAL PREDICTION</span>\n';
  h += '    <span class="cm"># service.predict() sends data to localhost:8000/invocations</span>\n';
  h += '    prediction = service.predict(data_array)\n';
  h += '    <span class="kw">return</span> prediction\n';
  h += '</div>';

  h += '<div class="callout"><strong>🔑 THE CRITICAL CHAIN:</strong> dynamic_importer → prediction_service_loader → predictor. Each step passes one piece of the puzzle. Step 1 provides the DATA. Step 2 provides the SERVER. Step 3 COMBINES them: server + data = prediction. <strong>If any link breaks, the whole chain fails.</strong></div>';
  return h;
}

function switchAnatomy(sub, evt){
  currentAnatomy = sub;
  var tabs = document.querySelectorAll('#subtab-nav .anatomy-subtab');
  for(var i = 0; i < tabs.length; i++){ tabs[i].classList.remove('active'); }
  if(evt && evt.target){ evt.target.classList.add('active'); }

  var sc = document.getElementById('sub-content');
  if(!sc){ return; }
  sc.innerHTML = getAnatomyContent(sub);

  // Also update main content area if we're on the anatomy tab
  var mainContent = document.getElementById('content');
  if(mainContent){
    // Rebuild anatomy header + sub-tabs + content
    var rebuilt = buildAnatomyHeader();
    rebuilt += getAnatomyContent(sub);
    mainContent.innerHTML = rebuilt;
  }
}

  h += '    <span class="cm"># → Prediction: {"predictions": [185000.50]}</span>\n';
  h += '    <span class="cm"># → This house is worth ~$185,000!</span>\n';
  h += '<span class="kw">else</span>:\n';
  h += '    print(<span class="str">f"Error: {response.status_code}"</span>)\n';
  h += '</div>';

  h += '<div class="beginner-box"><strong>🧑‍🏫 What are HTTP status codes?</strong><br>';
  h += '<strong>200</strong> = OK (everything worked)<br><strong>400</strong> = Bad Request (malformed JSON)<br><strong>404</strong> = Not Found (wrong URL)<br><strong>500</strong> = Internal Server Error (server crashed)<br><strong>503</strong> = Service Unavailable (server busy/starting)<br>';
  h += 'Always check <code>response.status_code</code> — predicting on a 500 error gives you an error message, not a prediction!</div>';

}

function getAnatomyLoader(){
  var h = '';
  h += '<h4 style="font-family:\'Space Grotesk\',sans-serif;font-size:0.75rem;color:var(--violet);margin:1rem 0 0.4rem">🔬 Anatomy of model_loader.py — ALL 23 Lines</h4>';
  h += '<p style="color:var(--tdim);font-size:0.72rem;margin-bottom:0.4rem"><strong>File:</strong> <code>steps/model_loader.py</code>. Loads a specific model version from ZenML\'s Model Registry. Alternative to ml_pipeline() — use when you want the <strong>production</strong> model, not a freshly trained one.</p>';

  h += '<div class="code-box" style="font-size:0.65rem;line-height:1.75;text-align:left">';
  h += '<span class="cm"># ============================================================================</span>\n';
  h += '<span class="cm"># IMPORTS</span>\n';
  h += '<span class="cm"># ============================================================================</span>\n';
  h += '<span class="kw">from</span> sklearn.pipeline <span class="kw">import</span> Pipeline\n';
  h += '<span class="cm">#   The TYPE returned (sklearn Pipeline = preprocessor + model)</span>\n';
  h += '<span class="kw">from</span> zenml <span class="kw">import</span> Model, step\n';
  h += '<span class="cm">#   Model: ZenML\'s Model Registry class</span>\n';
  h += '<span class="cm">#   Model(name="prices_predictor", version="production")</span>\n';
  h += '<span class="cm">#   "Give me the production version of prices_predictor"</span>\n';
  h += '</div>';

  h += '<div class="code-box" style="font-size:0.65rem;line-height:1.75;text-align:left">';
  h += '<span class="cm"># ============================================================================</span>\n';
  h += '<span class="cm"># THE @step FUNCTION</span>\n';
  h += '<span class="cm"># ============================================================================</span>\n\n';
  h += '<span class="deco">@step</span>\n';
  h += '<span class="kw">def</span> <span class="fn">model_loader</span>(model_name: <span class="cls">str</span>) -> Pipeline:\n';
  h += '    <span class="str">"""Loads the current production model pipeline."""</span>\n\n';
  h += '    <span class="cm"># Look up the model in ZenML\'s Model Registry</span>\n';
  h += '    <span class="cm"># name="prices_predictor" — the model we registered</span>\n';
  h += '    <span class="cm"># version="production" — the PROMOTED version (not staging)</span>\n';
  h += '    <span class="cm"># Registry tracks: staging → production → archived</span>\n';
  h += '    model = Model(name=model_name, version=<span class="str">"production"</span>)\n\n';
  h += '    <span class="cm"># Load the actual sklearn Pipeline artifact</span>\n';
  h += '    <span class="cm"># "sklearn_pipeline" = artifact name set in model_building_step</span>\n';
  h += '    <span class="cm"># load_artifact() reads from ZenML\'s artifact store</span>\n';
  h += '    <span class="cm"># (could be local disk, S3 bucket, or GCS)</span>\n';
  h += '    model_pipeline: Pipeline = model.load_artifact(<span class="str">"sklearn_pipeline"</span>)\n';
  h += '    <span class="kw">return</span> model_pipeline\n';
  h += '</div>';

  h += '<div class="code-box" style="font-size:0.65rem;line-height:1.75;text-align:left">';
  h += '<span class="cm"># ============================================================================</span>\n';
  h += '<span class="cm"># model_loader vs ml_pipeline() — WHEN TO USE WHICH?</span>\n';
  h += '<span class="cm"># ============================================================================</span>\n';
  h += '<span class="cm">#</span>\n';
  h += '<span class="cm"># ml_pipeline()</span>\n';
  h += '<span class="cm">#   → Runs ALL 7 steps fresh (ingest, impute, feature, ...)</span>\n';
  h += '<span class="cm">#   → Trains a NEW model every time</span>\n';
  h += '<span class="cm">#   → Use when: you want to retrain + deploy</span>\n';
  h += '<span class="cm">#</span>\n';
  h += '<span class="cm"># model_loader()</span>\n';
  h += '<span class="cm">#   → Loads an EXISTING model from the registry</span>\n';
  h += '<span class="cm">#   → No training — just load what\'s already saved</span>\n';
  h += '<span class="cm">#   → Use when: you want to deploy the current PRODUCTION model</span>\n';
  h += '<span class="cm">#     without retraining (e.g., deploying to a new server)</span>\n';
  h += '</div>';

  h += '<div class="beginner-box"><strong>🧑‍🏫 What is a Model Registry and "version: production"?</strong><br>';
  h += 'The <strong>Model Registry</strong> is like a library catalog for ML models:<br>';
  h += '<strong>staging</strong> = "this version looks good, testing it now"<br>';
  h += '<strong>production</strong> = "approved for real-world use"<br>';
  h += '<strong>archived</strong> = "old version, kept for history"<br>';
  h += '<code>version="production"</code> means "give me the one approved for real predictions." This prevents accidentally serving a broken staging model.</div>';

  return h;
}
