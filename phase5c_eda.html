<div class="code-box"><span class="cm"># Strategy Interface</span>
<span class="kw">class</span> <span class="fn">DataInspectionStrategy</span>(ABC):
    <span class="kw">@abstractmethod</span>
    <span class="kw">def</span> inspect(self, df) -> pd.DataFrame: <span class="kw">pass</span>

<span class="cm"># Concrete Strategy 1: Data Types + Nulls + Cardinality</span>
