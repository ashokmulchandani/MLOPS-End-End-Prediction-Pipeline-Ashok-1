<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.6rem 0 0.3rem">🏠 Ames Housing: Column-by-Column Decisions</h4>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.4rem;margin:0.6rem 0;font-size:0.6rem">
<div style="background:var(--red-bg,#ffebe9);border:1px solid var(--red);border-radius:6px;padding:0.5rem"><strong style="color:var(--red)">DROP (4 columns)</strong><br>PoolQC: 99.7% null<br>Alley: 93% null<br>Fence: 80% null<br>MiscFeature: 96% null</div>
<div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:6px;padding:0.5rem"><strong style="color:var(--amber)">FILL with meaning</strong><br>FireplaceQu→"None"<br>LotFrontage→median<br>GarageYrBlt→0<br>Garage*→"None"/0</div>
<div style="background:var(--green-bg);border:1px solid var(--green);border-radius:6px;padding:0.5rem"><strong style="color:var(--green)">FILL and move on</strong><br>Electrical→mode<br>Bsmt*→mode<br>MasVnr*→median<br>All <10% null</div>
</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 Strategy Pattern Code</h4>
<div class="code-box"><span class="cm"># CONTRACT: Every strategy MUST have handle()</span>
<span class="kw">class</span> <span class="fn">MissingValueHandlingStrategy</span>(ABC):
    <span class="kw">@abstractmethod</span>
    <span class="kw">def</span> handle(self, df: pd.DataFrame) -> pd.DataFrame: <span class="kw">pass</span>

<span class="cm"># STRATEGY A: Delete rows with nulls</span>
<span class="kw">class</span> <span class="fn">DropMissingValuesStrategy</span>(MissingValueHandlingStrategy):
    <span class="kw">def</span> handle(self, df):
        <span class="kw">return</span> df.dropna()

<span class="cm"># STRATEGY B: Fill nulls (median, mean, mode, or constant)</span>
<span class="kw">class</span> <span class="fn">FillMissingValuesStrategy</span>(MissingValueHandlingStrategy):
    <span class="kw">def</span> __init__(self, method=<span class="str">"median"</span>):
        self.method = method
    <span class="kw">def</span> handle(self, df):
        <span class="kw">if</span> self.method == <span class="str">"median"</span>: <span class="kw">return</span> df.fillna(df.median())
        <span class="kw">if</span> self.method == <span class="str">"mean"</span>:   <span class="kw">return</span> df.fillna(df.mean())
        <span class="kw">if</span> self.method == <span class="str">"mode"</span>:   <span class="kw">return</span> df.fillna(df.mode().iloc[0])
        <span class="kw">return</span> df.fillna(self.method)  <span class="cm"># constant value like 0 or "None"</span>

<span class="cm"># HANDLER: Delegates to whichever strategy you set</span>
<span class="kw">class</span> <span class="fn">MissingValueHandler</span>:
    <span class="kw">def</span> set_strategy(self, strategy):
        self.strategy = strategy
    <span class="kw">def</span> handle_missing_values(self, df):
        <span class="kw">return</span> self.strategy.handle(df)  <span class="cm"># ← DELEGATION</span></div>

<div class="code-box"><span class="cm"># ZenML Step (steps/handle_missing_values_step.py)</span>
<span class="kw">@step</span>
<span class="kw">def</span> <span class="fn">handle_missing_values_step</span>(df: pd.DataFrame) -> pd.DataFrame:
    handler = MissingValueHandler(FillMissingValuesStrategy(<span class="str">"median"</span>))
    <span class="kw">return</span> handler.handle_missing_values(df)</div>

<div class="callout"><strong>🔑 ONE LINE SWAP:</strong> <code>handler.set_strategy(DropMissingValuesStrategy())</code> — and the entire pipeline drops instead of fills. <strong>Nothing else changes.</strong>

<div class="code-box"><span class="cm"># USE it — swap strategies in ONE line</span>
handler = MissingValueHandler()
handler.set_strategy(FillMissingValuesStrategy(<span class="str">"median"</span>))
clean_df = handler.handle_missing_values(raw_df)

<span class="cm"># Want to try dropping instead? ONE line change:</span>
handler.set_strategy(DropMissingValuesStrategy())
<span class="cm"># The handler, pipeline, and rest of code — ZERO changes.</span></div>`;}

<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:0.8rem"><strong>File:</strong> <code>src/feature_engineering.py</code>. 4 strategies: <strong>Log Transformation, Standard Scaling, MinMax Scaling, OneHot Encoding.</strong></p>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.6rem 0 0.3rem">🎯 The 4 Strategies — What Each One Does</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin:0.6rem 0;font-size:0.62rem">
<div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:6px;padding:0.6rem"><strong style="color:var(--amber)">📐 Log Transformation</strong><br>Applies log(x) to skewed features.<br><strong>When:</strong> Feature is right-skewed.<br><strong>Ames:</strong> SalePrice, GrLivArea.<br><strong>Result:</strong> Compresses long tail → nearly normal.</div>
<div style="background:var(--vbg);border:1px solid var(--violet);border-radius:6px;padding:0.6rem"><strong style="color:var(--violet)">📏 StandardScaling</strong><br>(x - mean) ÷ std. Centers at 0.<br><strong>When:</strong> Features have different scales.<br><strong>Ames:</strong> All numerical features.<br><strong>Result:</strong> LotArea(1300-215K) and Bedrooms(0-8) now comparable.</div>
<div style="background:var(--cyan-bg);border:1px solid var(--cyan);border-radius:6px;padding:0.6rem"><strong style="color:var(--cyan)">📊 MinMaxScaling</strong><br>(x - min) ÷ (max - min). Scales to [0,1].<br><strong>When:</strong> Neural networks, images.<br><strong>Ames:</strong> Not used. StandardScaler preferred.<br><strong>Risk:</strong> Outliers stretch the range.</div>
<div style="background:var(--green-bg);border:1px solid var(--green);border-radius:6px;padding:0.6rem"><strong style="color:var(--green)">🔤 OneHotEncoding</strong><br>Each category → its own binary column.<br><strong>When:</strong> Nominal data with <50 categories.<br><strong>Ames:</strong> 37 categorical columns.<br><strong>Result:</strong> "Neighborhood" → 25 binary columns.</div>
</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 Strategy Pattern Code</h4>
<div class="code-box"><span class="kw">class</span> <span class="fn">FeatureEngineeringStrategy</span>(ABC):
    <span class="kw">@abstractmethod</span>
    <span class="kw">def</span> apply_transformation(self, df) -> pd.DataFrame: <span class="kw">pass</span>

<span class="kw">class</span> <span class="fn">LogTransformation</span>(FeatureEngineeringStrategy):
    <span class="kw">def</span> __init__(self, features): self.features = features
    <span class="kw">def</span> apply_transformation(self, df):
        <span class="kw">for</span> col <span class="kw">in</span> self.features:
            df[col] = np.log1p(df[col])  <span class="cm"># log(1+x), safe for zeros</span>
        <span class="kw">return</span> df

<span class="kw">class</span> <span class="fn">StandardScaling</span>(FeatureEngineeringStrategy):
    <span class="kw">def</span> apply_transformation(self, df):
        scaler = StandardScaler()
        df[num_cols] = scaler.fit_transform(df[num_cols])
        <span class="kw">return</span> df

<span class="kw">class</span> <span class="fn">FeatureEngineer</span>:  <span class="cm"># Context / Handler</span>
    <span class="kw">def</span> set_strategy(self, s): self.strategy = s
    <span class="kw">def</span> apply_feature_engineering(self, df):
        <span class="kw">return</span> self.strategy.apply_transformation(df)</div>

<div class="callout"><strong>🔑 Ordered application:</strong> Log first (on raw data), THEN scale (on transformed data). The ZenML step calls <strong>log → scale → encode</strong> in sequence. Order matters — log before scale, never the reverse.</div>`;}

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.6rem 0 0.3rem">🎯 Z-Score vs IQR — Which to Use?</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin:0.6rem 0;font-size:0.62rem">
<div style="background:var(--vbg);border:2px solid var(--violet);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.65rem;color:var(--violet);font-weight:700;margin-bottom:0.3rem">📐 Z-Score Detection</div>
<div style="color:var(--tdim);line-height:1.7">
<strong>Formula:</strong> z = (x − μ) ÷ σ<br>
<strong>Rule:</strong> Remove if |z| > 3<br>
<strong>Meaning:</strong> Values more than 3 standard deviations from the mean.<br><br>
<strong>✅ Used in Ames:</strong> threshold=3 on SalePrice.<br>
<strong>⚠ Weakness:</strong> Mean + std are themselves affected by extreme outliers.
</div>
</div>
<div style="background:var(--cyan-bg);border:2px solid var(--cyan);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.65rem;color:var(--cyan);font-weight:700;margin-bottom:0.3rem">📏 IQR Detection</div>
<div style="color:var(--tdim);line-height:1.7">
<strong>Formula:</strong> IQR = Q3 − Q1<br>
<strong>Rule:</strong> Remove if x < Q1−1.5×IQR or x > Q3+1.5×IQR<br>
<strong>Meaning:</strong> Values outside the "box" in a box plot.<br><br>
<strong>✅ Better when:</strong> Many extreme outliers exist.<br>
<strong>✅ Robust:</strong> Median + quartiles resist outliers.
</div>
</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 Strategy Pattern Code</h4>
<div class="code-box"><span class="kw">class</span> <span class="fn">OutlierDetectionStrategy</span>(ABC):
    <span class="kw">@abstractmethod</span>
    <span class="kw">def</span> detect_outliers(self, df, column) -> pd.DataFrame: <span class="kw">pass</span>

<span class="kw">class</span> <span class="fn">ZScoreOutlierDetection</span>(OutlierDetectionStrategy):
    <span class="kw">def</span> __init__(self, threshold=3): self.threshold = threshold
    <span class="kw">def</span> detect_outliers(self, df, column):
        z_scores = np.abs((df[column] - df[column].mean()) / df[column].std())
        <span class="kw">return</span> df[z_scores < self.threshold]  <span class="cm"># Keep only safe rows</span>

<span class="kw">class</span> <span class="fn">IQROutlierDetection</span>(OutlierDetectionStrategy):
    <span class="kw">def</span> detect_outliers(self, df, column):
        Q1, Q3 = df[column].quantile(0.25), df[column].quantile(0.75)
        IQR = Q3 - Q1
        <span class="kw">return</span> df[(df[column] >= Q1-1.5*IQR) & (df[column] <= Q3+1.5*IQR)]

<span class="kw">class</span> <span class="fn">OutlierDetector</span>:  <span class="cm"># Context — also handles capping option</span>
    <span class="kw">def</span> set_strategy(self, s): self.strategy = s
    <span class="kw">def</span> handle_outliers(self, df, column, method=<span class="str">'remove'</span>):
        <span class="kw">if</span> method == <span class="str">'remove'</span>: <span class="kw">return</span> self.strategy.detect_outliers(df, column)
        <span class="kw">elif</span> method == <span class="str">'cap'</span>: <span class="kw">return</span> self._cap_outliers(df, column)</div>

<div class="callout"><strong>🔑 Ames uses ZScore(threshold=3) on SalePrice.</strong> Removes ~5-8 extreme houses. You can swap to IQR in one line: <code>detector.set_strategy(IQROutlierDetection())</code>.

<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  STRATEGY B: FILL nulls (with a choice of method)</span>
<span style="color:#6a9955;">#</span>
<span style="color:#569cd6;">class</span> <span style="color:#4ec9b0;">FillMissingValuesStrategy</span>(MissingValueHandlingStrategy):
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── __init__ = the SETUP that runs when you create this object</span>
<span style="color:#6a9955;">#      │   Called automatically when you write: FillMissingValuesStrategy("median")</span>
<span style="color:#6a9955;">#      │</span>
<span style="color:#6a9955;">#      │         ┌── method = input parameter</span>
<span style="color:#6a9955;">#      │         │</span>
<span style="color:#6a9955;">#      │         │            ┌── "median" is the DEFAULT if you don\'t pass anything</span>
<span style="color:#6a9955;">#      │         │            │</span>
    <span style="color:#569cd6;">def</span> <span style="color:#c586c0;">__init__</span>(<span style="color:#569cd6;">self</span>, method=<span style="color:#ce9178;">"median"</span>):
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── Store "median" (or whatever was passed) ON this object</span>
<span style="color:#6a9955;">#      │   self.method = pocket on the object. method = value passed in.</span>
<span style="color:#6a9955;">#      │   Without self. → value disappears when __init__ finishes!</span>
        <span style="color:#569cd6;">self</span>.method = method
<span style="color:#6a9955;">#      └── pocket ─┘   └── the value ("median", "mean", "mode", or a number)</span>
<span style="color:#6a9955;">#</span>
    <span style="color:#569cd6;">def</span> <span style="color:#c586c0;">handle</span>(<span style="color:#569cd6;">self</span>, df):
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── Check WHAT method was stored during __init__</span>
<span style="color:#6a9955;">#      │   self.method reads the pocket we set up above</span>
        <span style="color:#569cd6;">if</span> <span style="color:#569cd6;">self</span>.method == <span style="color:#ce9178;">"median"</span>: <span style="color:#569cd6;">return</span> df.fillna(df.median())
<span style="color:#6a9955;">#      └──────────────────────┘  └── fill NaN with column medians</span>
        <span style="color:#569cd6;">if</span> <span style="color:#569cd6;">self</span>.method == <span style="color:#ce9178;">"mean"</span>:   <span style="color:#569cd6;">return</span> df.fillna(df.mean())
<span style="color:#6a9955;">#                                               └── column averages</span>
        <span style="color:#569cd6;">if</span> <span style="color:#569cd6;">self</span>.method == <span style="color:#ce9178;">"mode"</span>:   <span style="color:#569cd6;">return</span> df.fillna(df.mode().iloc[0])
<span style="color:#6a9955;">#                                               └── most common value</span>
        <span style="color:#569cd6;">return</span> df.fillna(<span style="color:#569cd6;">self</span>.method)
<span style="color:#6a9955;">#      └── if none matched → use the constant (e.g., 0 or "None")</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  📦 WHO WRITES THIS: You. ~15 lines per strategy. Copy the pattern.</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  LAYER 3: THE HANDLER (delegator)                           ║</span>
<span style="color:#6a9955;">#  ║  "I don\'t do the work. I delegate to the strategy."         ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── NOT a subclass! No (ABC). Standalone class.</span>
<span style="color:#569cd6;">class</span> <span style="color:#4ec9b0;">MissingValueHandler</span>:
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── "Remember THIS strategy for later"</span>
<span style="color:#6a9955;">#      │</span>
<span style="color:#6a9955;">#      │         ┌── strategy is a MissingValueHandlingStrategy object</span>
<span style="color:#6a9955;">#      │         │   (either DropMissingValues OR FillMissingValues)</span>
    <span style="color:#569cd6;">def</span> <span style="color:#c586c0;">set_strategy</span>(<span style="color:#569cd6;">self</span>, strategy):
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── STORE it on myself so handle_missing_values can use it</span>
        <span style="color:#569cd6;">self</span>.strategy = strategy
<span style="color:#6a9955;">#      └── pocket ──┘   └── the strategy object (Drop/Fill)</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── "Do the work — by delegating to the strategy"</span>
    <span style="color:#569cd6;">def</span> <span style="color:#c586c0;">handle_missing_values</span>(<span style="color:#569cd6;">self</span>, df):
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── THIS IS THE MAGIC: delegates to whichever strategy is active</span>
<span style="color:#6a9955;">#      │   self.strategy = the one you set with set_strategy()</span>
<span style="color:#6a9955;">#      │   .handle(df) = call its handle() method</span>
        <span style="color:#569cd6;">return</span> <span style="color:#569cd6;">self</span>.strategy.handle(df)
<span style="color:#6a9955;">#      └── delegate ────────────┘</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  📦 WHO WRITES THIS: You. ~8 lines. Written ONCE.</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  LAYER 4: HOW TO USE (your code that calls it)              ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── 1. Create the handler (a MissingValueHandler object)</span>
handler = MissingValueHandler()
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── 2. Set which strategy it should use</span>
<span style="color:#6a9955;">#  │   Creates a FillMissingValuesStrategy with method="median"</span>
<span style="color:#6a9955;">#  │   and passes it into handler.set_strategy()</span>
handler.set_strategy(FillMissingValuesStrategy(<span style="color:#ce9178;">"median"</span>))
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── 3. Do the work — handler delegates to the strategy</span>
<span style="color:#6a9955;">#  │   raw_df = original data with nulls. clean_df = result.</span>
clean_df = handler.handle_missing_values(raw_df)
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── 4. Want dropping instead? ONE LINE CHANGE:</span>
<span style="color:#6a9955;">#  │   handler.set_strategy(DropMissingValuesStrategy())</span>
<span style="color:#6a9955;">#  │   clean_df = handler.handle_missing_values(raw_df)</span>
<span style="color:#6a9955;">#  └── The handler. The pipeline. The rest of the code — ZERO changes.</span></div>

<div class="callout"><strong>🧠 THE 4-LAYER PATTERN (Memorize This):</strong> Layer 1: CONTRACT (ABC + @abstractmethod) → Layer 2: STRATEGIES (2+ concrete classes) → Layer 3: HANDLER (delegates) → Layer 4: USAGE (3 lines, swappable). <strong>Every Strategy module in this pipeline follows these exact 4 layers.</strong></div>`;}
}
