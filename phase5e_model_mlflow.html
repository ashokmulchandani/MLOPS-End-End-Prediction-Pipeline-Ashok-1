<h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--violet);margin-bottom:0.3rem">🧠 Model Building (Strategy Pattern)</h3>
<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:0.8rem"><strong>File:</strong> <code>steps/model_building_step.py</code>. Strategy lets you swap models without changing the pipeline. Start with <strong>LinearRegression</strong> — the simplest model that works.</p>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 The Model Building Code</h4>
<div class="code-box"><span class="cm"># FILE: steps/model_building_step.py</span>
<span class="kw">from</span> zenml <span class="kw">import</span> step, ArtifactConfig, Model
<span class="kw">import</span> mlflow

<span class="cm"># ZenML Model registration</span>
model = Model(name=<span class="str">"prices_predictor"</span>)

<span class="kw">@step</span>(experiment_tracker=..., model=model)
<span class="kw">def</span> <span class="fn">model_building_step</span>(X_train, y_train):
    <span class="cm"># 1. Split columns by type</span>
    cat_cols = X_train.select_dtypes(include=[<span class="str">"object"</span>]).columns
    num_cols = X_train.select_dtypes(exclude=[<span class="str">"object"</span>]).columns

    <span class="cm"># 2. Build the preprocessing pipeline</span>
    preprocessor = ColumnTransformer([
        (<span class="str">"num"</span>, SimpleImputer(strategy=<span class="str">"mean"</span>), num_cols),
        (<span class="str">"cat"</span>, Pipeline([
            (<span class="str">"imputer"</span>, SimpleImputer(strategy=<span class="str">"most_frequent"</span>)),
            (<span class="str">"encoder"</span>, OneHotEncoder(handle_unknown=<span class="str">"ignore"</span>))
        ]), cat_cols)
    ])

    <span class="cm"># 3. Full pipeline = preprocess + model</span>
    pipeline = Pipeline([
        (<span class="str">"preprocessor"</span>, preprocessor),
        (<span class="str">"model"</span>, LinearRegression())
    ])

    <span class="cm"># 4. MLflow auto-tracks EVERYTHING</span>
    mlflow.sklearn.autolog()
    pipeline.fit(X_train, y_train)

    <span class="kw">return</span> pipeline</div>

<div class="callout"><strong>🔑 ONE LINE MAGIC:</strong> <code>mlflow.sklearn.autolog()</code> — MLflow automatically logs ALL parameters, metrics, and the trained model. <strong>Zero manual logging code needed.</strong>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:1rem 0 0.4rem;text-align:left">🔬 COMPLETE Anatomy of model_building_step.py — All 104 Lines</h4>
<div class="code-box" style="font-size:0.75rem;line-height:2;text-align:left">
<span style="color:#6a9955;"># FILE: steps/model_building_step.py</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  PART 1: IMPORTS + ZENML SETUP                              ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── ZenML: the pipeline orchestrator</span>
<span style="color:#6a9955;">#  │   step = decorator, ArtifactConfig = labels, Model = registry</span>
<span style="color:#6a9955;">#  │</span>
<span style="color:#569cd6;">from</span> zenml <span style="color:#569cd6;">import</span> step, ArtifactConfig, Model
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── MLflow: experiment tracking</span>
<span style="color:#569cd6;">import</span> mlflow
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── sklearn: the actual ML tools</span>
<span style="color:#6a9955;">#  │   LinearRegression = the model</span>
<span style="color:#6a9955;">#  │   Pipeline + ColumnTransformer = preprocessing</span>
<span style="color:#6a9955;">#  │   SimpleImputer = fill missing values</span>
<span style="color:#6a9955;">#  │   OneHotEncoder = text categories → numbers</span>
<span style="color:#569cd6;">from</span> sklearn.linear_model <span style="color:#569cd6;">import</span> LinearRegression
<span style="color:#569cd6;">from</span> sklearn.pipeline <span style="color:#569cd6;">import</span> Pipeline
<span style="color:#569cd6;">from</span> sklearn.compose <span style="color:#569cd6;">import</span> ColumnTransformer
<span style="color:#569cd6;">from</span> sklearn.impute <span style="color:#569cd6;">import</span> SimpleImputer
<span style="color:#569cd6;">from</span> sklearn.preprocessing <span style="color:#569cd6;">import</span> OneHotEncoder
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  PART 2: ZENML MODEL REGISTRATION                           ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── Register this model in ZenML\'s Model Registry</span>
<span style="color:#6a9955;">#  │   name = unique identifier. Every trained version is tracked.</span>
<span style="color:#6a9955;">#  │</span>
model = Model(
    name=<span style="color:#ce9178;">"prices_predictor"</span>,
<span style="color:#6a9955;">#  └── ZenML stores every version under this name ─┘</span>
    version=<span style="color:#569cd6;">None</span>,          <span style="color:#6a9955;">← Auto-increment version number</span>
    license=<span style="color:#ce9178;">"Apache 2.0"</span>,
    description=<span style="color:#ce9178;">"Price prediction model for houses."</span>
)
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  PART 3: THE @step DECORATOR                                 ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── @step = ZenML decorator. "ZenML, please track this function."</span>
<span style="color:#6a9955;">#  │   Without it → normal Python. With it → ZenML watches everything.</span>
<span style="color:#6a9955;">#  │</span>
<span style="color:#6a9955;">#  │   experiment_tracker= → connects this step to MLflow</span>
<span style="color:#6a9955;">#  │   model= → registers output in ZenML Model Registry</span>
<span style="color:#6a9955;">#  │</span>
<span style="color:#569cd6;">@step</span>(experiment_tracker=..., model=model)
<span style="color:#6a9955;">#  └── "connect to MLflow" ─┘  └── "register in ZenML" ─┘</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── def = define a function</span>
<span style="color:#6a9955;">#  │   X_train = features (2336 rows × ~80 columns after EDA)</span>
<span style="color:#6a9955;">#  │   y_train = target SalePrice (2336 values)</span>
<span style="color:#6a9955;">#  │   -> Pipeline = "I will return a trained sklearn Pipeline"</span>
<span style="color:#6a9955;">#  │</span>
<span style="color:#569cd6;">def</span> <span style="color:#c586c0;">model_building_step</span>(
    X_train: pd.DataFrame,
    y_train: pd.Series
) -> Pipeline:
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  PART 4: SPLIT COLUMNS BY TYPE                               ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── Select categorical columns: type = "object" in pandas</span>
<span style="color:#6a9955;">#  │   Ex: Neighborhood, HouseStyle, MSZoning...</span>
    cat_cols = X_train.select_dtypes(include=[<span style="color:#ce9178;">"object"</span>]).columns
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── Select numerical columns: everything ELSE</span>
<span style="color:#6a9955;">#  │   Ex: GrLivArea, OverallQual, YearBuilt...</span>
    num_cols = X_train.select_dtypes(exclude=[<span style="color:#ce9178;">"object"</span>]).columns
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  PART 5: BUILD THE PREPROCESSOR (ColumnTransformer)          ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── ColumnTransformer: "These columns → this treatment"</span>
    preprocessor = ColumnTransformer([
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── TRANSFORMER 1: Numerical columns</span>
<span style="color:#6a9955;">#      │   name = "num" (arbitrary label)</span>
<span style="color:#6a9955;">#      │   strategy = "mean" → fill NaN with column average</span>
<span style="color:#6a9955;">#      │   applied to: num_cols (38 columns)</span>
        (<span style="color:#ce9178;">"num"</span>, SimpleImputer(strategy=<span style="color:#ce9178;">"mean"</span>), num_cols),
<span style="color:#6a9955;">#       └── label ─┘ └── fill NaN with avg ─┘ └── on these cols ─┘</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#      ┌── TRANSFORMER 2: Categorical columns (Pipeline inside Pipeline!)</span>
<span style="color:#6a9955;">#      │   name = "cat"</span>
<span style="color:#6a9955;">#      │   Pipeline: impute first → then encode</span>
        (<span style="color:#ce9178;">"cat"</span>, Pipeline([
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#          ┌── Step 1: Fill missing categories with most frequent</span>
<span style="color:#6a9955;">#          │   Ex: GarageType NaN → "Attchd" (most common)</span>
            SimpleImputer(strategy=<span style="color:#ce9178;">"most_frequent"</span>),
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#          ┌── Step 2: Convert text categories to binary columns</span>
<span style="color:#6a9955;">#          │   Ex: "Downtown" → [1,0,0,0,...] (25 columns)</span>
<span style="color:#6a9955;">#          │   handle_unknown="ignore": NEW category → all zeros (no crash!)</span>
            OneHotEncoder(handle_unknown=<span style="color:#ce9178;">"ignore"</span>)
        ]), cat_cols)
    ])
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ╔══════════════════════════════════════════════════════════════╗</span>
<span style="color:#6a9955;">#  ║  PART 6: THE FULL PIPELINE (Preprocess + Model)             ║</span>
<span style="color:#6a9955;">#  ╚══════════════════════════════════════════════════════════════╝</span>
<span style="color:#6a9955;">#</span>
<span style="color:#6a9955;">#  ┌── Pipeline: connects preprocessor + model into ONE object</span>
<span style="color:#6a9955;">#  │   THIS is what guarantees train/serve parity!</span>

<h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--amber);margin-bottom:0.3rem">🔧 ColumnTransformer — The Secret Sauce</h3>
<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:0.8rem">This is the <strong>most important concept</strong> in the entire pipeline. The ColumnTransformer applies DIFFERENT preprocessing to numerical and categorical columns — all in ONE object that you save and reuse.</p>

<div style="background:var(--amber-bg);border:2px solid var(--amber);border-radius:12px;padding:1rem;margin:1rem 0">
<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--amber);margin-bottom:0.5rem;text-align:center">🔧 What ColumnTransformer Does (Visual)</h4>

<span style="color:var(--cyan)">NUM: Impute(mean) → Scale</span><br>

</div>

<div class="viz-box out" style="min-width:120px"><strong>MODEL READY</strong><br>~250 cols<br>all numerical</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">🔑 Why ColumnTransformer = Train/Serve Parity</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin:0.6rem 0;font-size:0.62rem">
<div style="background:var(--red-bg,#ffebe9);border:2px solid var(--red);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--red);font-weight:700;margin-bottom:0.3rem">❌ WITHOUT ColumnTransformer</div>

Training: scaler.fit(train) → model.fit()<br>
Serving: scaler.fit(live) → model.predict()<br><br>
<span style="color:var(--red)">Two DIFFERENT scalers!<br>Silent wrong predictions!</span>
</div>
</div>
<div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--green);font-weight:700;margin-bottom:0.3rem">✅ WITH ColumnTransformer</div>
<div style="color:var(--tdim);line-height:1.7">
Training: pipeline.fit(train)<br>
Serving: pipeline.predict(live)<br><br>
<span style="color:var(--green)">SAME pipeline object!<br>Impossible to mismatch.</span>
</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 The ColumnTransformer Code (Inside model_building_step.py)</h4>
<div class="code-box"><span class="cm"># NUMERICAL pipeline: fill missing with mean</span>
num_pipe = SimpleImputer(strategy=<span class="str">"mean"</span>)
<span class="cm"># → GrLivArea null → fill with average GrLivArea</span>

<span class="cm"># CATEGORICAL pipeline: fill missing + one-hot encode</span>
cat_pipe = Pipeline([
    (<span class="str">"imputer"</span>, SimpleImputer(strategy=<span class="str">"most_frequent"</span>)),
    <span class="cm"># → "Missing" → fill with most common category</span>
    (<span class="str">"encoder"</span>, OneHotEncoder(handle_unknown=<span class="str">"ignore"</span>))
    <span class="cm"># → "Downtown" → [1,0,0,...] 25 cols. New category? → all zeros.</span>
])

<span class="cm"># COMBINE: apply different transforms to different columns</span>
preprocessor = ColumnTransformer([
    (<span class="str">"num"</span>, num_pipe, numerical_cols),    <span class="cm"># → 38 columns get imputed</span>
    (<span class="str">"cat"</span>, cat_pipe, categorical_cols)  <span class="cm"># → 43 columns get encoded → ~200 cols</span>
])

<span class="cm"># FULL pipeline: preprocess + model = ONE object</span>
pipeline = Pipeline([
    (<span class="str">"preprocessor"</span>, preprocessor),
    (<span class="str">"model"</span>, LinearRegression())
])</div>

<div class="callout"><strong>🧠 ONE OBJECT = NO MISTAKES:</strong> Save the ENTIRE pipeline with MLflow. At serving time, load it and call <code>pipeline.predict()</code>. The scaler, imputer, encoder — all use the SAME fitted values from training. <strong>Impossible to mismatch.</strong>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:1rem 0 0.4rem;text-align:left">🔬 Anatomy — The ColumnTransformer Line by Line</h4>
<div class="code-box" style="font-size:0.72rem;text-align:left"><span style="color:#6a9955;">#  ┌── num_pipe: handles numerical columns</span>
<span style="color:#6a9955;">#  │   SimpleImputer(strategy="mean") = fill NaN with column average</span>
num_pipe = SimpleImputer(strategy=<span style="color:#ce9178;">"mean"</span>)
<span style="color:#6a9955;">#  └── Ex: GrLivArea NaN → filled with avg GrLivArea (1515 sqft)</span>

<span style="color:#6a9955;">#  ┌── cat_pipe: handles categorical columns (PIPELINE inside a PIPELINE!)</span>
cat_pipe = Pipeline([
    SimpleImputer(strategy=<span style="color:#ce9178;">"most_frequent"</span>),
<span style="color:#6a9955;">#  └── Ex: GarageType NaN → filled with "Attchd" (most common)</span>
    OneHotEncoder(handle_unknown=<span style="color:#ce9178;">"ignore"</span>)
<span style="color:#6a9955;">#  └── Ex: "Downtown" → [1,0,0...] (25 binary cols for 25 neighborhoods)</span>
<span style="color:#6a9955;">#      handle_unknown="ignore": new neighborhood → all zeros (no crash!)</span>
])

<span style="color:#6a9955;">#  ┌── ColumnTransformer: "Column A gets treatment X, Column B gets Y"</span>
preprocessor = ColumnTransformer([
    (<span style="color:#ce9178;">"num"</span>, num_pipe, numerical_cols),
<span style="color:#6a9955;">#  └── name ─┘ └── pipeline ─┘ └── which columns ─┘</span>
    (<span style="color:#ce9178;">"cat"</span>, cat_pipe, categorical_cols)
])

<span style="color:#6a9955;">#  ┌── FULL pipeline: preprocess → predict. ONE object.</span>
pipeline = Pipeline([
    (<span style="color:#ce9178;">"preprocessor"</span>, preprocessor),  <span style="color:#6a9955;">← Step 1</span>
    (<span style="color:#ce9178;">"model"</span>, LinearRegression())     <span style="color:#6a9955;">← Step 2</span>
])</div></div>`;}
