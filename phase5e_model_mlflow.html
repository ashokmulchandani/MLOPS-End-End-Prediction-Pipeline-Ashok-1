if(p==='overview'){c.innerHTML=`
<h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--violet);margin-bottom:0.3rem">🗺️ Phase 5E: Where Model + MLflow Fit</h3>
<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:1rem">After processing (Phase 5D), the pipeline <strong>builds a model and tracks everything</strong>. MLflow records every experiment so you can compare and choose the best one.</p>

<div style="background:var(--vbg);border:2px solid var(--violet);border-radius:12px;padding:1rem;margin:1rem 0">
<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin-bottom:0.6rem;text-align:center">📊 The 7-Step Pipeline — Steps 6-7</h4>

<div class="viz-row">
<div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.4rem 0.6rem"><strong>Steps 1-5</strong><br>Processed Data<br><span style="color:var(--tmut)">Strategy x4</span></div>

<div class="viz-box proc"><strong>Step 6</strong><br>MODEL BUILD<br><span style="color:var(--tmut)">MLflow autolog</span></div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.75rem;color:var(--violet);margin:0.8rem 0 0.3rem">🎯 What MLflow Tracks (Automatically)</h4>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin:0.6rem 0;font-size:0.6rem">

<div style="font-size:1.3rem">⚙️</div><strong>PARAMETERS</strong><br><span style="color:var(--tmut)">imputer strategy,<br>scaler type, model type<br>→ All auto-logged</span>

<div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.6rem;text-align:center">

<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:0.8rem"><strong>File:</strong> <code>steps/model_building_step.py</code>. Strategy lets you swap models without changing the pipeline. Start with <strong>LinearRegression</strong> — the simplest model that works.</p>

<div style="background:var(--vbg);border:2px solid var(--violet);border-radius:12px;padding:1rem;margin:1rem 0">

<div class="viz-box in"><strong>INPUT</strong><br>X_train: 2336 rows<br>y_train: SalePrice</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">🎯 The Strategy — Start Simple, Upgrade Later</h4>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin:0.6rem 0;font-size:0.62rem">
<div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--green);font-weight:700">⭐ START HERE</div>
<div style="color:var(--tdim);line-height:1.7;margin-top:0.3rem"><strong>LinearRegression</strong><br>Simplest. Fastest.<br>Explainable coefficients.<br>R² ~0.85 on Ames.</div>
</div>
<div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--amber);font-weight:700">🔧 TRY LATER</div>
<div style="color:var(--tdim);line-height:1.7;margin-top:0.3rem"><strong>Ridge / Lasso</strong><br>Add regularization.<br>Better if overfitting.<br>Swap in 1 line.</div>
</div>
<div style="background:var(--vbg);border:1px solid var(--violet);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--violet);font-weight:700">🚀 ADVANCED</div>
<div style="color:var(--tdim);line-height:1.7;margin-top:0.3rem"><strong>XGBoost</strong><br>Best accuracy.<br>More complex.<br>Only if needed.</div>
</div>
</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 The Model Building Code</h4>
<div class="code-box"><span class="cm"># FILE: steps/model_building_step.py</span>
<span class="kw">from</span> zenml <span class="kw">import</span> step, ArtifactConfig, Model
<span class="kw">import</span> mlflow

<span class="cm"># ZenML Model registration</span>
model = Model(name=<span class="str">"prices_predictor"</span>)

<span class="kw">@step</span>(experiment_tracker=..., model=model)
<span class="kw">def</span> <span class="fn">model_building_step</span>(X_train, y_train):
    <span class="cm"># 1. Split columns by type</span>
    cat_cols = X_train.select_dtypes(include=[<span class="str">"object"</span>]).columns
    num_cols = X_train.select_dtypes(exclude=[<span class="str">"object"</span>]).columns

    <span class="cm"># 2. Build the preprocessing pipeline</span>
    preprocessor = ColumnTransformer([
        (<span class="str">"num"</span>, SimpleImputer(strategy=<span class="str">"mean"</span>), num_cols),
        (<span class="str">"cat"</span>, Pipeline([
            (<span class="str">"imputer"</span>, SimpleImputer(strategy=<span class="str">"most_frequent"</span>)),
            (<span class="str">"encoder"</span>, OneHotEncoder(handle_unknown=<span class="str">"ignore"</span>))
        ]), cat_cols)
    ])

    <span class="cm"># 3. Full pipeline = preprocess + model</span>
    pipeline = Pipeline([
        (<span class="str">"preprocessor"</span>, preprocessor),
        (<span class="str">"model"</span>, LinearRegression())
    ])

    <span class="cm"># 4. MLflow auto-tracks EVERYTHING</span>
    mlflow.sklearn.autolog()
    pipeline.fit(X_train, y_train)

    <span class="kw">return</span> pipeline</div>

<div class="callout"><strong>🔑 ONE LINE MAGIC:</strong> <code>mlflow.sklearn.autolog()</code> — MLflow automatically logs ALL parameters, metrics, and the trained model. <strong>Zero manual logging code needed.</strong></div>`;}

<h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--amber);margin-bottom:0.3rem">🔧 ColumnTransformer — The Secret Sauce</h3>
<p style="color:var(--tdim);font-size:0.85rem;margin-bottom:0.8rem">This is the <strong>most important concept</strong> in the entire pipeline. The ColumnTransformer applies DIFFERENT preprocessing to numerical and categorical columns — all in ONE object that you save and reuse.</p>

<div style="background:var(--amber-bg);border:2px solid var(--amber);border-radius:12px;padding:1rem;margin:1rem 0">
<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--amber);margin-bottom:0.5rem;text-align:center">🔧 What ColumnTransformer Does (Visual)</h4>

<strong>ColumnTransformer</strong><br>
<span style="color:var(--cyan)">NUM: Impute(mean) → Scale</span><br>
<span style="color:var(--magenta)">CAT: Impute(mode) → OneHotEncode</span>
</div>

</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">🔑 Why ColumnTransformer = Train/Serve Parity</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin:0.6rem 0;font-size:0.62rem">
<div style="background:var(--red-bg,#ffebe9);border:2px solid var(--red);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--red);font-weight:700;margin-bottom:0.3rem">❌ WITHOUT ColumnTransformer</div>
<div style="color:var(--tdim);line-height:1.7">
Training: scaler.fit(train) → model.fit()<br>
Serving: scaler.fit(live) → model.predict()<br><br>
<span style="color:var(--red)">Two DIFFERENT scalers!<br>Silent wrong predictions!</span>
</div>
</div>
<div style="background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:0.7rem;text-align:center">
<div style="font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--green);font-weight:700;margin-bottom:0.3rem">✅ WITH ColumnTransformer</div>
<div style="color:var(--tdim);line-height:1.7">
Training: pipeline.fit(train)<br>
Serving: pipeline.predict(live)<br><br>
<span style="color:var(--green)">SAME pipeline object!<br>Impossible to mismatch.</span>
</div>
</div>
</div>

<h4 style="font-family:'Space Grotesk',sans-serif;font-size:0.72rem;color:var(--violet);margin:0.8rem 0 0.3rem">📝 The ColumnTransformer Code (Inside model_building_step.py)</h4>
<div class="code-box"><span class="cm"># NUMERICAL pipeline: fill missing with mean</span>
num_pipe = SimpleImputer(strategy=<span class="str">"mean"</span>)
<span class="cm"># → GrLivArea null → fill with average GrLivArea</span>

<span class="cm"># CATEGORICAL pipeline: fill missing + one-hot encode</span>
cat_pipe = Pipeline([
    (<span class="str">"imputer"</span>, SimpleImputer(strategy=<span class="str">"most_frequent"</span>)),
    <span class="cm"># → "Missing" → fill with most common category</span>
    (<span class="str">"encoder"</span>, OneHotEncoder(handle_unknown=<span class="str">"ignore"</span>))
    <span class="cm"># → "Downtown" → [1,0,0,...] 25 cols. New category? → all zeros.</span>
])

<span class="cm"># COMBINE: apply different transforms to different columns</span>
preprocessor = ColumnTransformer([
    (<span class="str">"num"</span>, num_pipe, numerical_cols),    <span class="cm"># → 38 columns get imputed</span>
    (<span class="str">"cat"</span>, cat_pipe, categorical_cols)  <span class="cm"># → 43 columns get encoded → ~200 cols</span>
])

<span class="cm"># FULL pipeline: preprocess + model = ONE object</span>
pipeline = Pipeline([
    (<span class="str">"preprocessor"</span>, preprocessor),
    (<span class="str">"model"</span>, LinearRegression())
])</div>

<div class="callout"><strong>🧠 ONE OBJECT = NO MISTAKES:</strong> Save the ENTIRE pipeline with MLflow. At serving time, load it and call <code>pipeline.predict()</code>. The scaler, imputer, encoder — all use the SAME fitted values from training. <strong>Impossible to mismatch.</strong></div>`;}
